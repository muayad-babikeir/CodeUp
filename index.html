<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeUp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== CodeUp — نظام تصميم داكن مستوحى من لوحات ألوان @graphix_theory =====
   Onyx (خلفية) + Candy Blue (أساسي) + Lime (XP/نجاح) + Violet (ثانوي/قيادة) */
:root{
  --bg0:#000000; --bg1:#000000; --bg2:#16181C;
  --ink:#E7E9EA; --ink60:#71767B; --ink40:#536471;
  --line:rgba(239,243,244,.13); --line-strong:rgba(239,243,244,.24);
  --surface:rgba(239,243,244,.04); --surface-solid:#16181C;
  --accent:#1D9BF0; --accent-ink:#FFFFFF; --accent-deep:#1A8CD8;
  --green:#3DD16F; --green-ink:#06210F; --green-soft:rgba(61,209,111,.14);
  --red:#F2555F; --red-soft:rgba(242,85,95,.14);
  --blur:blur(22px);
  --shadow:0 24px 60px -24px rgba(0,0,0,.8);
}
*{box-sizing:border-box; min-width:0}
body{
  margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);line-height:1.55;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(255,255,255,.06), transparent 60%),
    radial-gradient(700px 500px at 110% 10%, rgba(255,255,255,.04), transparent 55%),
    var(--bg0);
  background-attachment:fixed;
}
.mono{font-family:'IBM Plex Mono',monospace}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:.02em;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:var(--ink60);background:rgba(255,255,255,.03);white-space:nowrap}
.tag.on_track,.tag.active,.tag.approved,.tag.reviewed{background:var(--green-soft);color:var(--green);border-color:rgba(61,209,111,.35)}
.tag.at_risk,.tag.pending{background:rgba(255,255,255,.06);color:var(--ink);border-color:var(--line-strong)}
.tag.behind,.tag.rejected,.tag.late{background:var(--red-soft);color:var(--red);border-color:rgba(242,85,95,.35)}
.tag.inactive,.tag.missing{background:rgba(255,255,255,.04);color:var(--ink60);border-color:var(--line)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
.eyebrow::before{content:"> ";color:var(--ink40)}
.app{min-height:100vh;display:grid;place-items:center;padding:18px}
.card{width:min(440px,100%);background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.brand{text-align:center;margin-bottom:26px}
.brand .mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(155deg,var(--accent),var(--accent-deep));color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 14px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:19px;overflow:hidden}
.brand .mark img{width:68%;height:68%;object-fit:contain}
.brand h1{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.brand p{margin:0;color:var(--ink60);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.04);padding:4px;border-radius:12px;margin-bottom:22px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:11px;border-radius:9px;cursor:pointer;color:var(--ink60);font-family:inherit;font-size:14px}
.tabs button.active{background:var(--ink);color:var(--bg0);box-shadow:0 1px 3px rgba(0,0,0,.3);font-weight:600}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--ink)}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;outline:0;font-family:inherit;font-size:14px;background:rgba(255,255,255,.03);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink40)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.primary{width:100%;border:0;border-radius:12px;padding:13px;margin-top:20px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:var(--accent-ink);font-weight:700;font-family:inherit;font-size:14.5px;cursor:pointer}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.6}
.message.show{display:block}.message.error{background:var(--red-soft);color:var(--red)}.message.success{background:var(--green-soft);color:var(--green)}
.hidden{display:none!important}
.pwdWrap{position:relative}.pwdWrap input{padding-left:44px}
.pwdToggle{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:8px;color:var(--ink60)}
.pwdToggle:hover{background:rgba(255,255,255,.06)}.pwdToggle svg{width:19px;height:19px}.pwdToggle .eyeOff{display:none}.pwdToggle.show .eyeOn{display:none}.pwdToggle.show .eyeOff{display:block}
.spinner{display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(11,12,16,.3);border-top-color:var(--accent-ink);animation:spin .7s linear infinite;margin:0 auto}
.primary.loading .btnText{display:none}.primary.loading .spinner{display:block}@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.dashboard{min-height:100vh;padding:16px}
.wrap{max-width:1080px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:18px;padding:12px 16px;position:sticky;top:10px;z-index:20}
.topbrand{display:flex;align-items:center;gap:9px;font-weight:700;flex-shrink:0}
.topbrand .mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(155deg,var(--accent),var(--accent-deep));color:var(--accent-ink);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;overflow:hidden}
.topbrand .mark img{width:68%;height:68%;object-fit:contain}
.topRight{display:flex;align-items:center;gap:8px;flex-shrink:0}
.iconBtn{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconBtn svg{width:19px;height:19px}
.badge{position:absolute;top:-5px;left:-5px;background:var(--red);color:#fff;font-size:10.5px;border-radius:999px;padding:1px 5px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.logout{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink)}
.logout:hover{border-color:var(--line-strong)}
.welcome{max-width:1080px;margin:24px auto 4px}
.welcome h2{font-size:25px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.welcome p{color:var(--ink60);font-size:14px;margin:0}
.sectionHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px;flex-wrap:wrap}
.sectionHead h3{font-size:15px;margin:0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.box{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:18px;padding:18px}
@media(max-width:500px){.card{padding:26px 20px}}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--ink60);font-size:13.5px;margin:14px 0;flex-wrap:wrap}
.crumbs button{border:0;background:transparent;color:var(--accent);cursor:pointer;font-weight:600;padding:0;font-family:inherit;font-size:13.5px}
.courseCard{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:border-color .15s,transform .15s;overflow:hidden}
.courseCard:hover{border-color:var(--accent);transform:translateY(-2px)}
.courseCard h3{margin:0 0 6px;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.courseCard p{margin:0;color:var(--ink60);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subtabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:14px;padding:5px;margin:14px 0;scrollbar-width:thin}
.subtabs button{white-space:nowrap;border:0;background:transparent;padding:9px 13px;border-radius:10px;cursor:pointer;color:var(--ink60);font-weight:600;font-family:inherit;font-size:13.5px;flex-shrink:0}
.subtabs button.active{background:var(--ink);color:var(--bg0)}
/* ===== شريط تبويبات علوي (نمط فيسبوك) ===== */
.fbTabBar{display:flex;gap:2px;overflow-x:auto;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:14px;padding:5px;margin:14px 0;scrollbar-width:thin}
.fbTabBar button{white-space:nowrap;border:0;background:transparent;padding:10px 14px;border-radius:10px;cursor:pointer;color:var(--ink60);font-weight:600;font-family:inherit;font-size:13px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.fbTabBar button .tabIcon{font-size:17px;line-height:1;display:inline-flex}
.fbTabBar button .tabIcon svg{width:19px;height:19px}
.feedTag svg{width:13px;height:13px;vertical-align:-2px;margin-inline-end:2px}
.fileCard{display:flex;align-items:center;gap:10px;background:rgba(239,243,244,.03);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.fileCard .tabIcon svg{width:20px;height:20px;flex-shrink:0}
.fileCard.archived .tabIcon svg{color:var(--ink60)}
.fileCardInfo{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.fileCardInfo b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.videoEmbed{position:relative;border-radius:12px;overflow:hidden;margin:10px 0;background:#000;aspect-ratio:16/9}
.videoEmbed img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.videoEmbed .playBtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(0,0,0,.25)}
.videoEmbed .playBtn svg{width:56px;height:56px;color:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.videoEmbed iframe{width:100%;height:100%;border:0;display:block}
.progressBar{height:8px;border-radius:6px;background:rgba(239,243,244,.1);overflow:hidden;margin-top:8px}
.progressFill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.commentsToggle{background:transparent;border:0;color:var(--ink60);font-size:12.5px;cursor:pointer;padding:6px 0;display:block}
.commentsList.hidden{display:none}
.commentHead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.roleBadge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px}
.roleBadge.admin{background:rgba(0,186,124,.15);color:#00BA7C}
.roleBadge.leader{background:rgba(29,155,240,.15);color:var(--accent)}
.roleBadge.squadmate{background:rgba(239,243,244,.1);color:var(--ink60)}
.commentAttachRow{display:flex;gap:6px;align-items:center;margin-top:6px}
.commentAttachRow button{flex-shrink:0}
.iconBtn svg{width:15px;height:15px}
.recordingDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#E03131;margin-inline-end:4px;animation:pulseRec 1s infinite}
@keyframes pulseRec{0%,100%{opacity:1}50%{opacity:.3}}
.fbTabBar button.active{background:var(--ink);color:var(--bg0)}
.joinBanner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--accent,#4c8dff);border-radius:14px;padding:12px 16px;margin:14px 0}
.joinBanner p{margin:0;font-size:13.5px;color:var(--ink60)}
.feedAnnouncement{border-inline-start:3px solid var(--accent,#4c8dff)}
.feedTag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(76,141,255,.15);color:var(--accent,#4c8dff);margin-bottom:6px}
[dir="rtl"] .drawer{right:auto;left:0;border-inline-start:0;border-inline-end:1px solid var(--line-strong);transform:translateX(-100%)}
[dir="rtl"] .drawer.open{transform:translateX(0)}
.drawer h4{margin:0 0 14px;font-size:13px;color:var(--ink60);font-weight:600}
.drawerItem{display:block;width:100%;text-align:start;border:0;background:transparent;color:var(--ink);padding:12px 10px;border-radius:10px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;margin-bottom:4px}
.drawerItem.active{background:var(--ink);color:var(--bg0)}
.drawerItem:not(.active):hover{background:rgba(255,255,255,.06)}
.card2{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row > *{min-width:0}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;font-family:inherit;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.dark{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.dark:hover{filter:brightness(1.08)}
.btn.danger{background:rgba(242,85,95,.1);color:var(--red);border-color:rgba(242,85,95,.28)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.small{font-size:12.5px;color:var(--ink60)}
.emptyState{text-align:center;padding:36px 16px;color:var(--ink60);font-size:13.5px}
.modalBg{position:fixed;inset:0;background:rgba(2,2,4,.68);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.modal{background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:20px;padding:22px;width:min(460px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal h3{margin-top:0;font-size:16px}
.timelinePost{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.timelinePost .meta{display:flex;justify-content:space-between;gap:8px;color:var(--ink60);font-size:12.5px;margin-bottom:8px;flex-wrap:wrap}
.timelinePost .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.reactBar{display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.reactBtn{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:12.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink)}
.reactBtn.active{background:rgba(255,255,255,.12);border-color:var(--line-strong);color:var(--ink)}
.commentBox{margin-top:10px;display:flex;gap:8px}
.commentBox input{flex:1;min-width:0}
.comment{font-size:12.5px;padding:8px 0;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.filterRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filterRow button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.filterRow button.active{background:var(--ink);color:var(--bg0);border-color:var(--ink)}
/* شارات XP/Streak — تستخدم Lime كلون نجاح/طاقة مميز عن باقي الحالات */
.xpPill{display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;color:var(--green-ink);background:var(--green);padding:3px 9px;border-radius:999px}
.btn.success{background:var(--green-soft);color:var(--green);border-color:rgba(61,209,111,.35)}
</style>
</head>
<body>
<div id="authApp" class="app">
<main class="card">
<div class="brand">
<div class="mark"><img src="codeup-logo.svg" alt="CodeUp"></div>
<h1>CodeUp</h1><p>منصة التعلم والتدريب البرمجي</p>
</div>
<div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="signupTab">إنشاء حساب</button></div>
<form id="authForm">
<div id="nameGroup" class="hidden"><label>الاسم الكامل</label><input id="fullName" type="text" autocomplete="name" placeholder="اكتب اسمك"></div>
<label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com" required style="direction:ltr;text-align:left">
<label>كلمة المرور</label>
<div class="pwdWrap">
<input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="••••••••" required style="direction:ltr;text-align:left">
<button type="button" id="pwdToggle" class="pwdToggle" aria-label="إظهار كلمة المرور">
<svg class="eyeOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.5 21.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
</button>
</div>
<button id="submitBtn" class="primary" type="submit"><span class="btnText">تسجيل الدخول</span><span class="spinner"></span></button>
</form>
<div id="message" class="message"></div>
</main>
</div>

<div id="dashboardApp" class="dashboard hidden">
<div class="topbar wrap">
<div class="topbrand"><div class="mark"><img src="codeup-logo.svg" alt="CodeUp"></div><span>CodeUp</span></div>
<div class="topRight">
<button class="iconBtn" id="notifBtn" title="الإشعارات" aria-label="الإشعارات">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
<span id="notifBadge" class="badge hidden">0</span>
</button>
<button id="logoutBtn" class="logout">تسجيل الخروج</button>
</div>
</div>

<div class="wrap">
<div id="crumbs" class="crumbs hidden"><button id="crumbHome">الرئيسية</button></div>
<div id="viewRoot"></div>
</div>
</div>

<script src="js/supabase.js"></script>
<script src="js/shared.js"></script>
<script>
const authApp=document.getElementById("authApp"),dash=document.getElementById("dashboardApp"),form=document.getElementById("authForm"),msg=document.getElementById("message"),btn=document.getElementById("submitBtn");
let mode="login";
function setMode(m){mode=m;loginTab.classList.toggle("active",m==="login");signupTab.classList.toggle("active",m==="signup");nameGroup.classList.toggle("hidden",m!=="signup");btn.querySelector(".btnText").textContent=m==="signup"?"إنشاء الحساب":"تسجيل الدخول";msg.className="message"}
function message(t,c="error"){msg.textContent=t;msg.className="message show "+c}
loginTab.onclick=()=>setMode("login");signupTab.onclick=()=>setMode("signup");
const pwdInput=document.getElementById("password"),pwdToggle=document.getElementById("pwdToggle");
pwdToggle.onclick=()=>{const show=pwdInput.type==="password";pwdInput.type=show?"text":"password";pwdToggle.classList.toggle("show",show);pwdToggle.setAttribute("aria-label",show?"إخفاء كلمة المرور":"إظهار كلمة المرور")};

function cleanEmail(raw){
  return raw.normalize("NFKC").replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069]/g,"").trim();
}

form.onsubmit=async e=>{
  e.preventDefault();btn.disabled=true;btn.classList.add("loading");msg.className="message";
  try{
    let email=cleanEmail(document.getElementById("email").value),password=document.getElementById("password").value;
    if(mode==="signup"){
      let name=fullName.value.trim();if(!name){message("اكتب اسمك أولاً.");btn.disabled=false;btn.classList.remove("loading");return}
      let{data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});
      if(error)throw error;
      if(data.session)await bootApp(data.user);else message("تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا كان تأكيد البريد مفعلاً.","success");
    }else{
      let{data,error}=await db.auth.signInWithPassword({email,password});
      if(error)throw error;
      await bootApp(data.user);
    }
  }catch(e){message(e.message||"حدث خطأ غير متوقع")}
  finally{btn.disabled=false;btn.classList.remove("loading")}
};
logoutBtn.onclick=async()=>{await db.auth.signOut();dash.classList.add("hidden");authApp.classList.remove("hidden");setMode("login");App.ctx=null};
(async()=>{let{data}=await db.auth.getSession();if(data.session)await bootApp(data.session.user)})();

async function bootApp(user){
  authApp.classList.add("hidden");dash.classList.remove("hidden");
  await App.init(user);
}

const App = {
  ctx: null,
  view: {name:"home"},
  root: document.getElementById("viewRoot"),
  crumbs: document.getElementById("crumbs"),

  async init(user){
    this.ctx = await CodeUp.loadMyContext();
    document.getElementById("crumbHome").onclick = ()=>{this.go({name:"home"})};
    document.getElementById("notifBtn").onclick = ()=>this.openNotifications();
    this.refreshNotifBadge();
    CodeUp.subscribeToMyNotifications(user.id, (n)=>{ this.refreshNotifBadge(); CodeUp.toast(n.title, "info"); });
    window.addEventListener("popstate", ()=> this.routeFromHash(false));
    await this.routeFromHash(false, true);
  },

  // يحوّل الرابط الحالي (#/course/<slug>/<tab>) إلى view، أو يفتح الرئيسية لو ما فيه رابط
  async routeFromHash(pushState, isInitial){
    const hash = location.hash.replace(/^#\/?/, "");
    const parts = hash.split("/").filter(Boolean);
    if(parts[0] === "course" && parts[1]){
      const {data: course} = await db.from("courses").select("id").eq("slug", parts[1]).single();
      if(course){ this.go({name:"course", courseId: course.id, tab: parts[2]||"learning"}, pushState); return; }
    }
    this.go({name:"home"}, pushState);
  },

  go(view, updateHash = true){
    this.view = view;
    if(updateHash){
      if(view.name === "course" && view.courseSlug){
        history.pushState(null, "", `#/course/${view.courseSlug}/${view.tab||"learning"}`);
      }else if(view.name === "home"){
        history.pushState(null, "", location.pathname);
      }
    }
    this.render();
  },

  crumbTrail(items){
    this.crumbs.classList.remove("hidden");
    const home = this.crumbs.querySelector("#crumbHome");
    this.crumbs.innerHTML = "";
    this.crumbs.appendChild(home);
    items.forEach(it=>{
      const sep=document.createElement("span");sep.textContent="/";sep.className="mono";this.crumbs.appendChild(sep);
      const b=document.createElement("button");b.textContent=it.label;b.onclick=it.onClick;this.crumbs.appendChild(b);
    });
  },

  async refreshNotifBadge(){
    const {count} = await db.from("notifications").select("id",{count:"exact",head:true}).eq("profile_id", this.ctx.user.id).eq("is_read", false);
    const badge=document.getElementById("notifBadge");
    if(count>0){badge.textContent=count>9?"9+":count;badge.classList.remove("hidden")}else badge.classList.add("hidden");
  },

  async openNotifications(){
    const {data} = await db.from("notifications").select("*").eq("profile_id", this.ctx.user.id).order("created_at",{ascending:false}).limit(20);
    const list = (data||[]).map(n=>`
      <div class="card2" style="${n.is_read?'':'background:rgba(255,255,255,.08)'}">
        <div class="row"><b style="font-size:13.5px">${CodeUp.escapeHtml(n.title)}</b><span class="small mono">${CodeUp.timeAgo(n.created_at)}</span></div>
      </div>`).join("") || `<div class="emptyState">لا توجد إشعارات بعد.</div>`;
    this.modal(`<h3>الإشعارات</h3><div>${list}</div>`, async ()=>{
      const ids=(data||[]).filter(n=>!n.is_read).map(n=>n.id);
      if(ids.length) await db.from("notifications").update({is_read:true}).in("id", ids);
      this.refreshNotifBadge();
    });
  },

  openTabDrawer(tabs, activeTab, onSelect){
    const bg=document.createElement("div");bg.className="drawerBg";
    const drawer=document.createElement("div");drawer.className="drawer";
    drawer.innerHTML = `<h4>القائمة</h4>` + tabs.map(([key,label])=>
      `<button class="drawerItem ${key===activeTab?'active':''}" data-tab="${key}">${label}</button>`).join("");
    bg.appendChild(drawer);
    document.body.appendChild(bg);
    requestAnimationFrame(()=>{bg.classList.add("open");drawer.classList.add("open")});
    function close(){
      bg.classList.remove("open");drawer.classList.remove("open");
      setTimeout(()=>bg.remove(),220);
    }
    bg.addEventListener("click",e=>{if(e.target===bg)close()});
    drawer.querySelectorAll("[data-tab]").forEach(b=>{
      b.onclick=()=>{ close(); if(b.dataset.tab!==activeTab) onSelect(b.dataset.tab); };
    });
  },

  modal(innerHtml, onClose){
    const bg=document.createElement("div");bg.className="modalBg";
    bg.innerHTML=`<div class="modal">${innerHtml}<div style="margin-top:16px;text-align:end"><button class="btn" id="modalClose">إغلاق</button></div></div>`;
    document.body.appendChild(bg);
    bg.addEventListener("click",e=>{if(e.target===bg)close()});
    function close(){bg.remove();if(onClose)onClose();}
    bg.querySelector("#modalClose").onclick=close;
    return {close, el:bg};
  },

  async render(){
    this.root.innerHTML = `<div class="emptyState">جارِ التحميل…</div>`;
    if(this.view.name==="home") return this.renderHome(this.view.homeTab);
    if(this.view.name==="course") return this.renderCourse(this.view.courseId, this.view.tab||"learning");
  },

  async renderHome(tab){
    tab = tab || this.view.homeTab || "feed";
    this.crumbs.classList.add("hidden");

    this.root.innerHTML = `
      <section class="welcome"><h2>مرحباً ${CodeUp.escapeHtml(this.ctx.profile.full_name||"")}</h2><p class="mono">${CodeUp.escapeHtml(this.ctx.user.email||"")}</p></section>
      <div class="fbTabBar">
        <button data-hometab="feed" class="${tab==='feed'?'active':''}"><span class="tabIcon">${Icon('timeline')}</span>الرئيسية</button>
        <button data-hometab="courses" class="${tab==='courses'?'active':''}"><span class="tabIcon">${Icon('learning')}</span>الكورسات</button>
      </div>
      <div id="homeBody"></div>`;
    this.root.querySelectorAll("[data-hometab]").forEach(b=>{
      b.onclick = ()=>{ this.view = {name:"home", homeTab:b.dataset.hometab}; this.renderHome(b.dataset.hometab); };
    });

    const body = document.getElementById("homeBody");
    if(tab === "courses") return this.renderHomeCourses(body);
    return this.renderHomeFeed(body);
  },

  async renderHomeCourses(body){
    const {data: courses} = await db.from("courses").select("*").eq("status","published").order("created_at");
    const enrolledIds = new Set(this.ctx.enrollments.map(e=>e.course_id));
    const myCourses = this.ctx.enrollments;
    let html = "";

    if(myCourses.length){
      html += `<div class="sectionHead"><h3 class="eyebrow">كورساتي</h3></div><div class="grid">`;
      html += myCourses.map(e=>`
        <div class="courseCard" data-course="${e.course_id}" data-slug="${CodeUp.escapeHtml(e.courses?.slug||"")}">
          <div class="row"><h3>${CodeUp.escapeHtml(e.courses?.name||"")}</h3><span class="tag ${e.status}">${statusLabel(e.status)}</span></div>
          <p>${e.squads?CodeUp.escapeHtml(e.squads.name):"بلا مجموعة بعد"}</p>
          <p class="small mono" style="margin-top:8px">تقدم ${e.progress}% · ${e.xp} XP · streak ${e.streak}</p>
        </div>`).join("");
      html += `</div>`;
    }

    const otherCourses = (courses||[]).filter(c=>!enrolledIds.has(c.id));
    if(otherCourses.length){
      html += `<div class="sectionHead"><h3 class="eyebrow">كورسات متاحة</h3></div><div class="grid">`;
      html += otherCourses.map(c=>`
        <div class="courseCard" data-course="${c.id}" data-slug="${CodeUp.escapeHtml(c.slug||"")}">
          <h3>${CodeUp.escapeHtml(c.name)}</h3>
          <p>${CodeUp.escapeHtml(c.description||"")}</p>
        </div>`).join("");
      html += `</div>`;
    }

    if(!myCourses.length && !otherCourses.length){
      html += `<div class="emptyState">لا توجد كورسات متاحة حاليًا.</div>`;
    }
    body.innerHTML = html;
    body.querySelectorAll(".courseCard").forEach(el=>{
      el.onclick = ()=> this.go({name:"course", courseId: el.dataset.course, courseSlug: el.dataset.slug, tab:"learning"});
    });
  },

  // الرئيسية المجمّعة: إعلانات عامة + منشورات حرة + تسليمات وتعليقات ولايكات من كل الكورسات المسجّل فيها الطالب
  async renderHomeFeed(body){
    const PAGE_SIZE = 15;
    const myCourseIds = this.ctx.enrollments.map(e=>e.course_id);
    body.innerHTML = `
      <div class="card2" style="margin-top:14px">
        <textarea id="newPostText" rows="2" placeholder="شارك تحديثًا أو سؤالًا مع الجميع…" style="width:100%;resize:vertical"></textarea>
        <div class="commentAttachRow" style="margin-top:8px">
          <input type="file" accept="image/*" id="newPostImage" style="display:none">
          <button class="btn iconBtn" id="newPostAttachBtn" title="إرفاق صورة">${Icon("paperclip")}</button>
          <button class="btn iconBtn" id="newPostRecordBtn" title="تسجيل صوتي">${Icon("mic")}</button>
          <div style="flex:1"></div>
          <button class="btn dark" id="newPostBtn">نشر</button>
        </div>
        <div id="newPostPreview" style="margin-top:6px"></div>
      </div>
      <div id="feedList"></div><div id="feedMore"></div>`;

    let pendingPostFile = null;
    const postPreview = document.getElementById("newPostPreview");
    document.getElementById("newPostAttachBtn").onclick = ()=> document.getElementById("newPostImage").click();
    document.getElementById("newPostImage").onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      pendingPostFile = f;
      postPreview.innerHTML = `<span class="small">📎 ${CodeUp.escapeHtml(f.name)}</span> <button class="btn" id="clearPostAttach">إزالة</button>`;
      document.getElementById("clearPostAttach").onclick = ()=>{ pendingPostFile=null; postPreview.innerHTML=""; };
    };
    const postRecordBtn = document.getElementById("newPostRecordBtn");
    if(navigator.mediaDevices?.getUserMedia){
      let mediaRecorder=null, chunks=[];
      postRecordBtn.onclick = async ()=>{
        if(mediaRecorder && mediaRecorder.state==="recording"){ mediaRecorder.stop(); return; }
        try{
          const stream = await navigator.mediaDevices.getUserMedia({audio:true});
          chunks=[]; mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e=>chunks.push(e.data);
          mediaRecorder.onstop = ()=>{
            stream.getTracks().forEach(t=>t.stop());
            const blob = new Blob(chunks,{type:"audio/webm"});
            pendingPostFile = new File([blob], `voice_${Date.now()}.webm`, {type:"audio/webm"});
            postPreview.innerHTML = `<span class="small">🎙️ تسجيل صوتي جاهز</span> <button class="btn" id="clearPostAttach">إزالة</button>`;
            document.getElementById("clearPostAttach").onclick = ()=>{ pendingPostFile=null; postPreview.innerHTML=""; };
            postRecordBtn.innerHTML = Icon("mic");
          };
          mediaRecorder.start();
          postRecordBtn.innerHTML = `<span class="recordingDot"></span>${Icon("stop")}`;
        }catch(e){ CodeUp.toast("تعذّر الوصول للميكروفون","error"); }
      };
    }else{ postRecordBtn.style.display="none"; }

    document.getElementById("newPostBtn").onclick = async ()=>{
      const ta = document.getElementById("newPostText");
      const val = ta.value.trim();
      if(!val && !pendingPostFile) return;
      const btn = document.getElementById("newPostBtn");
      btn.disabled = true;
      try{
        const {data: row, error} = await db.from("posts").insert({profile_id:this.ctx.user.id, content: val || "📎"}).select().single();
        if(error) throw error;
        if(pendingPostFile){
          const uploaded = await CodeUp.uploadCommentAttachment(pendingPostFile, this.ctx.user.id, row.id); // نفس منطق الرفع، مسار عام تحت posts
          await db.from("file_uploads").insert({
            uploader_id: this.ctx.user.id, related_type:"post", related_id: row.id,
            storage_path: uploaded.path, file_name: uploaded.name, mime_type: uploaded.type, file_size: uploaded.size
          });
          const fileRow = await db.from("file_uploads").select("id").eq("related_type","post").eq("related_id", row.id).single();
          if(fileRow.data) CodeUp.triggerTelegramSend(fileRow.data.id);
        }
        ta.value=""; pendingPostFile=null; postPreview.innerHTML="";
        loadFeed(true); CodeUp.toast("تم النشر","success");
      }catch(e){ CodeUp.toast(e.message,"error"); }
      finally{ btn.disabled = false; }
    };

    const list = body.querySelector("#feedList");
    const moreBox = body.querySelector("#feedMore");
    let page = 0;

    const loadFeed = async (reset)=>{
      if(reset){ page = 0; list.innerHTML = ""; }
      moreBox.innerHTML = `<div class="emptyState">جارِ التحميل…</div>`;

      const [{data: announcements}, {data: posts}, {data: subs}] = await Promise.all([
        page===0 ? db.from("announcements").select("*, profiles(full_name)").is("course_id", null).order("created_at",{ascending:false}).limit(10) : Promise.resolve({data:[]}),
        db.from("posts").select("*, profiles(full_name)").order("created_at",{ascending:false}).range(page*PAGE_SIZE, page*PAGE_SIZE+PAGE_SIZE-1),
        myCourseIds.length ? db.from("submissions").select("*, assignments(title,course_id,courses(name)), profiles(full_name)").in("assignments.course_id", myCourseIds).in("visibility",["course","squad"]).order("created_at",{ascending:false}).range(page*PAGE_SIZE, page*PAGE_SIZE+PAGE_SIZE-1) : Promise.resolve({data:[]})
      ]);
      const safeSubs = (subs||[]).filter(s=>s.assignments); // استبعاد أي صف ما رجع بسبب inner join
      const safePosts = posts || [];

      if(page===0 && !safeSubs.length && !safePosts.length && !(announcements||[]).length){
        list.innerHTML = `<div class="emptyState">لا توجد منشورات بعد. كن أول من يشارك شيئًا!</div>`; moreBox.innerHTML = ""; return;
      }

      const [{data: reactions}, {data: comments}, {data: postFiles}] = await Promise.all([
        db.from("reactions").select("*").in("target_type",["submission","post"]).in("target_id", [...safeSubs.map(s=>s.id), ...safePosts.map(p=>p.id)]),
        db.from("comments").select("*, profiles(full_name)").or(`submission_id.in.(${safeSubs.map(s=>s.id).join(",")||"00000000-0000-0000-0000-000000000000"}),post_id.in.(${safePosts.map(p=>p.id).join(",")||"00000000-0000-0000-0000-000000000000"})`).order("created_at"),
        db.from("file_uploads").select("*").eq("related_type","submission").in("related_id", safeSubs.map(s=>s.id))
      ]);
      const filesByPost = {};
      for(const f of (postFiles||[])) (filesByPost[f.related_id] ||= []).push(f);
      const {data: commentFiles} = await db.from("file_uploads").select("*").eq("related_type","comment").in("related_id", (comments||[]).map(c=>c.id));
      const filesByComment = Object.fromEntries((commentFiles||[]).map(f=>[f.related_id, f]));

      const feed = [
        ...(page===0?(announcements||[]):[]).map(a=>({type:"announcement", created_at:a.created_at, data:a})),
        ...safePosts.map(p=>({type:"post", created_at:p.created_at, data:p})),
        ...safeSubs.map(s=>({type:"submission", created_at:s.created_at, data:s}))
      ].sort((x,y)=> new Date(y.created_at) - new Date(x.created_at));

      const reactionsFor = (type,id)=> (reactions||[]).filter(r=>r.target_type===type && r.target_id===id);
      const commentsFor = (type,id)=> (comments||[]).filter(c=> type==='post' ? c.post_id===id : c.submission_id===id);

      const html = feed.map(item=>{
        if(item.type==="announcement"){
          const a = item.data;
          return `<div class="timelinePost feedAnnouncement"><span class="feedTag">${Icon("announcement")} إعلان عام</span>
            <div class="meta"><b style="color:var(--ink)">${CodeUp.escapeHtml(a.profiles?.full_name||"إدارة CodeUp")}</b><span class="mono">${CodeUp.timeAgo(a.created_at)}</span></div>
            <div class="body"><b>${CodeUp.escapeHtml(a.title)}</b>${a.content?`<br>${CodeUp.escapeHtml(a.content)}`:""}</div></div>`;
        }
        const isPost = item.type==="post";
        const d = item.data;
        const myLiked = reactionsFor(item.type, d.id).some(r=>r.user_id===this.ctx.user.id);
        const likeCount = reactionsFor(item.type, d.id).length;
        const itemComments = commentsFor(item.type, d.id);
        return `<div class="timelinePost" data-feeditem="${d.id}" data-type="${item.type}">
          <span class="feedTag">${Icon("check")} ${isPost?"منشور":"تسليم واجب"}${!isPost && d.assignments?.courses?.name ? " · " + CodeUp.escapeHtml(d.assignments.courses.name) : ""}</span>
          <div class="meta"><b style="color:var(--ink)">${CodeUp.escapeHtml(d.profiles?.full_name||"طالب")}</b><span class="mono">${CodeUp.timeAgo(d.created_at)}</span></div>
          ${!isPost?`<div class="small mono" style="margin-bottom:6px">${CodeUp.escapeHtml(d.assignments?.title||"")}</div>`:""}
          <div class="body">${CodeUp.escapeHtml(d.content||"")}</div>
          ${!isPost?(filesByPost[d.id]||[]).map(f=>renderFileCard(f,"submissions")).join(""):""}
          <div class="reactBar"><button class="reactBtn ${myLiked?'active':''}" data-like="${d.id}" data-liketype="${item.type}">إعجاب ${likeCount||""}</button></div>
          ${CodeUp.buildCommentsBlock(itemComments, {filesByComment})}
          ${commentComposerHtml(d.id, isPost?"post":"submission")}
        </div>`;
      }).join("");
      list.insertAdjacentHTML("beforeend", html);
      wireFileCardPreviews(list);
      CodeUp.wireCommentsToggle(list);

      list.querySelectorAll("[data-like]:not([data-wired])").forEach(b=>{
        b.dataset.wired = "1";
        b.onclick = async ()=>{ try{ await CodeUp.rpc.toggleReaction(b.dataset.liketype, b.dataset.like, "like"); loadFeed(true); }catch(e){ CodeUp.toast(e.message,"error"); } };
      });
      list.querySelectorAll("[data-commentsend]:not([data-wired])").forEach(b=>{
        b.dataset.wired = "1";
        const targetId = b.dataset.commentsend;
        const commentType = b.dataset.commenttype;
        const cardEl = b.closest(".timelinePost");
        const getPendingFile = wireCommentComposer(cardEl, targetId);
        b.onclick = async ()=>{
          const input = list.querySelector(`[data-commentinput="${targetId}"]`);
          const val = input.value.trim();
          const attach = getPendingFile();
          if(!val && !attach) return;
          b.disabled = true;
          try{
            const payload = {user_id:this.ctx.user.id, content: val || "📎"};
            if(commentType === "post") payload.post_id = targetId;
            else payload.submission_id = targetId;
            const {data: row, error} = await db.from("comments").insert(payload).select().single();
            if(error) throw error;
            if(attach){
              const course_id_for_file = safeSubs.find(s=>s.id===targetId)?.assignments?.course_id || null;
              const uploaded = await CodeUp.uploadCommentAttachment(attach, this.ctx.user.id, row.id);
              const {data: fileRow} = await db.from("file_uploads").insert({
                course_id: course_id_for_file, uploader_id: this.ctx.user.id, related_type:"comment",
                related_id: row.id, storage_path: uploaded.path, file_name: uploaded.name,
                mime_type: uploaded.type, file_size: uploaded.size
              }).select().single();
              if(fileRow) CodeUp.triggerTelegramSend(fileRow.id);
            }
            input.value=""; loadFeed(true);
          }catch(e){ CodeUp.toast(e.message,"error"); b.disabled = false; }
        };
      });

      if(safeSubs.length === PAGE_SIZE || safePosts.length === PAGE_SIZE){
        moreBox.innerHTML = `<button class="btn" id="feedMoreBtn">تحميل المزيد</button>`;
        moreBox.querySelector("#feedMoreBtn").onclick = ()=>{ page++; loadFeed(false); };
      }else{ moreBox.innerHTML = ""; }
    };
    loadFeed(true);
  },

  async renderCourse(courseId, tab){
    const {data: course} = await db.from("courses").select("*").eq("id", courseId).single();
    if(!course){ this.root.innerHTML = `<div class="emptyState">الكورس غير موجود.</div>`; return; }

    let myEnrollment = this.ctx.enrollments.find(e=>e.course_id===courseId);

    this.crumbTrail([{label: course.name, onClick: ()=>this.go({name:"course",courseId,tab:"learning"})}]);

    const isAdmin = this.ctx.courseAdminCourseIds.includes(courseId);
    const isLeader = this.ctx.leaderCourseIds.includes(courseId);

    const tabIcons = {learning:"learning",assignments:"assignments",timeline:"timeline",squads:"squads",progress:"progress",leaderboard:"leaderboard"};
    const tabs = [
      ["learning","التعلم"],["assignments","الواجبات"],["timeline","المستجدات"],
      ["squads","المجموعات"],["progress","تقدمي"],["leaderboard","المتصدرون"]
    ];
    let html = `
      <div class="fbTabBar">
        ${tabs.map(([key,label])=>`<button data-tab="${key}" class="${key===tab?'active':''}"><span class="tabIcon">${Icon(tabIcons[key])}</span>${label}</button>`).join("")}
      </div>
      ${!myEnrollment ? `
      <div class="joinBanner">
        <p>أنت تتصفح هذا الكورس فقط. انضم للمشاركة بالواجبات والمستجدات وتتبع تقدمك.</p>
        <button class="btn dark" id="joinCourseBtn" style="flex-shrink:0">انضمام للكورس</button>
      </div>` : ``}
      <div id="tabBody"></div>`;
    this.root.innerHTML = html;
    this.root.querySelectorAll(".fbTabBar [data-tab]").forEach(b=>{
      b.onclick = ()=>{ if(b.dataset.tab!==tab) this.go({name:"course",courseId,courseSlug:course.slug,tab:b.dataset.tab}); };
    });
    const joinBtn = document.getElementById("joinCourseBtn");
    if(joinBtn) joinBtn.onclick = async ()=>{
      joinBtn.disabled = true;
      try{
        await CodeUp.rpc.enrollInCourse(courseId);
        this.ctx = await CodeUp.loadMyContext();
        CodeUp.toast("تم الانضمام للكورس", "success");
        this.go({name:"course",courseId,courseSlug:course.slug,tab});
      }catch(e){ CodeUp.toast(e.message||"تعذّر الانضمام", "error"); joinBtn.disabled = false; }
    };

    const body = document.getElementById("tabBody");
    body.innerHTML = `<div class="emptyState">جارِ التحميل…</div>`;

    if(tab==="learning") return this.renderLearning(body, course);
    if(tab==="assignments") return this.renderAssignments(body, course, myEnrollment);
    if(tab==="timeline") return this.renderTimeline(body, course, myEnrollment);
    if(tab==="squads") return this.renderSquads(body, course, myEnrollment, isAdmin, isLeader);
    if(tab==="progress") return this.renderProgress(body, course, myEnrollment);
    if(tab==="leaderboard") return this.renderLeaderboard(body, course);
  },

  async renderLearning(body, course){
    const {data: units} = await db.from("units").select("*, lessons(*)").eq("course_id", course.id).order("order_index");
    if(!units || !units.length){ body.innerHTML = `<div class="emptyState">لا يوجد محتوى تعليمي منشور بعد.</div>`; return; }

    const allLessonIds = units.flatMap(u=>(u.lessons||[]).map(l=>l.id));
    const {data: myProgress} = allLessonIds.length
      ? await db.from("lesson_progress").select("lesson_id,status").eq("profile_id", this.ctx.user.id).in("lesson_id", allLessonIds)
      : {data:[]};
    const doneSet = new Set((myProgress||[]).filter(p=>p.status==="completed").map(p=>p.lesson_id));
    const total = allLessonIds.length;
    const donePct = total ? Math.round((doneSet.size/total)*100) : 0;

    body.innerHTML = `
      <div class="card2" style="margin-bottom:14px">
        <div class="row"><b>تقدّمك بالمحتوى</b><span class="mono">${donePct}%</span></div>
        <div class="progressBar"><div class="progressFill" style="width:${donePct}%"></div></div>
      </div>` +
      units.map(u=>`
      <div class="card2">
        <b>${CodeUp.escapeHtml(u.title)}</b>
        <div style="margin-top:8px">
          ${(u.lessons||[]).sort((a,b)=>a.order_index-b.order_index).map(l=>`
            <div class="lessonBlock" style="padding:8px 0;border-top:1px dashed rgba(255,255,255,.12)">
              <div class="row">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                  <input type="checkbox" data-lessondone="${l.id}" ${doneSet.has(l.id)?"checked":""}>
                  <span>${CodeUp.escapeHtml(l.title)}</span>
                </label>
              </div>
              ${l.video_url?youtubeEmbedHtml(l.video_url):""}
              ${l.text_content?`<p class="small" style="white-space:pre-wrap;margin-top:6px">${CodeUp.escapeHtml(l.text_content)}</p>`:""}
              ${l.pdf_url?`<a class="btn" style="margin-top:6px;display:inline-block" href="${l.pdf_url}" target="_blank">فتح ملف PDF ↗</a>`:""}
            </div>`).join("") || `<p class="small">لا توجد دروس بعد.</p>`}
        </div>
      </div>`).join("");
    wireYoutubeEmbeds(body);

    body.querySelectorAll("[data-lessondone]").forEach(cb=>{
      cb.onchange = async ()=>{
        const lessonId = cb.dataset.lessondone;
        cb.disabled = true;
        try{
          await db.from("lesson_progress").upsert({
            lesson_id: lessonId, profile_id: this.ctx.user.id,
            status: cb.checked ? "completed" : "not_started",
            completed_at: cb.checked ? new Date().toISOString() : null
          }, {onConflict: "lesson_id,profile_id"}).throwOnError();
          this.renderLearning(body, course); // إعادة رسم لتحديث نسبة التقدم
        }catch(e){ CodeUp.toast(e.message,"error"); cb.checked = !cb.checked; }
        finally{ cb.disabled = false; }
      };
    });
  },

  async renderAssignments(body, course, myEnrollment){
    const {data: assignments} = await db.from("assignments").select("*").eq("course_id", course.id).order("deadline");
    if(!assignments || !assignments.length){ body.innerHTML = `<div class="emptyState">لا توجد واجبات بعد.</div>`; return; }

    const {data: mySubs} = await db.from("submissions").select("*").eq("profile_id", this.ctx.user.id).in("assignment_id", assignments.map(a=>a.id));
    const subByAssignment = Object.fromEntries((mySubs||[]).map(s=>[s.assignment_id, s]));
    const {data: attachments} = await db.from("file_uploads").select("*").eq("related_type","assignment").in("related_id", assignments.map(a=>a.id));
    const attachByAssignment = {};
    for(const f of (attachments||[])) (attachByAssignment[f.related_id] ||= []).push(f);

    body.innerHTML = assignments.map(a=>{
      const sub = subByAssignment[a.id];
      const status = sub ? sub.status : "missing";
      return `
      <div class="card2">
        <div class="row"><b>${CodeUp.escapeHtml(a.title)}</b><span class="tag ${status}">${statusLabel(status)}</span></div>
        <p class="small">${CodeUp.escapeHtml(a.description||"")}</p>
        <p class="small mono">deadline: ${CodeUp.formatDate(a.deadline)}</p>
        ${(attachByAssignment[a.id]||[]).map(f=>renderFileCard(f,"course-assets")).join("")}
        <div class="row" style="margin-top:8px">
          <span class="small">${sub?`قدّمت ${CodeUp.timeAgo(sub.submitted_at)}${sub.grade!=null?` · الدرجة ${sub.grade}`:""}`:"لم تُقدّم بعد"}</span>
          <button class="btn dark" data-submit="${a.id}">${sub?"تعديل التسليم":"تسليم الواجب"}</button>
        </div>
      </div>`;
    }).join("");
    wireFileCardPreviews(body);

    body.querySelectorAll("[data-submit]").forEach(b=>{
      b.onclick = async ()=>{
        if(!myEnrollment){
          if(!confirm("للتسليم يجب الانضمام للكورس أولًا. تريد الانضمام الآن؟")) return;
          try{
            await CodeUp.rpc.enrollInCourse(course.id);
            this.ctx = await CodeUp.loadMyContext();
            myEnrollment = this.ctx.enrollments.find(e=>e.course_id===course.id);
          }catch(e){ CodeUp.toast(e.message||"تعذّر الانضمام", "error"); return; }
        }
        this.openSubmitModal(assignments.find(a=>a.id===b.dataset.submit), course, subByAssignment[b.dataset.submit]);
      };
    });
  },

  openSubmitModal(assignment, course, existing){
    const m = this.modal(`
      <h3>تسليم: ${CodeUp.escapeHtml(assignment.title)}</h3>
      <label>ملاحظات/شرح (اختياري)</label>
      <textarea id="subContent" rows="4">${CodeUp.escapeHtml(existing?.content||"")}</textarea>
      <label>الملف</label>
      <input type="file" id="subFile" accept="image/*,application/pdf,.doc,.docx,.txt">
      <div id="subFilePreview" style="margin-top:8px"></div>
      <label>مشاركة في المستجدات</label>
      <select id="subVisibility">
        <option value="private" ${existing?.visibility==="private"?"selected":""}>خاص — لا يظهر لأحد</option>
        <option value="squad" ${existing?.visibility==="squad"?"selected":""}>مجموعتي فقط</option>
        <option value="course" ${existing?.visibility==="course"?"selected":""}>كل الكورس</option>
      </select>
      <button class="primary" id="subSubmitBtn">إرسال</button>
      <div id="subMsg" class="message"></div>
    `);
    const previewBox = m.el.querySelector("#subFilePreview");
    m.el.querySelector("#subFile").onchange = (e)=>{
      const f = e.target.files[0];
      if(!f){ previewBox.innerHTML = ""; return; }
      const sizeKb = (f.size/1024).toFixed(0);
      if(f.type.startsWith("image/")){
        const url = URL.createObjectURL(f);
        previewBox.innerHTML = `<img src="${url}" style="max-width:100%;max-height:220px;border-radius:8px;display:block"><span class="small mono">${sizeKb} كيلوبايت — ستُضغط تلقائيًا قبل الرفع</span>`;
      }else{
        previewBox.innerHTML = `<div class="small mono">${CodeUp.escapeHtml(f.name)} — ${sizeKb} كيلوبايت</div>`;
      }
    };
    let submitIdempotencyKey = crypto.randomUUID();
    m.el.querySelector("#subSubmitBtn").onclick = async ()=>{
      const msgEl = m.el.querySelector("#subMsg");
      const submitBtn = m.el.querySelector("#subSubmitBtn");
      if(submitBtn.disabled) return; // منع تكرار فعلي حتى لو انضغط الزر مرتين بنفس اللحظة
      submitBtn.disabled = true;
      submitBtn.textContent = "جارِ الإرسال…";
      try{
        const content = m.el.querySelector("#subContent").value.trim();
        const visibility = m.el.querySelector("#subVisibility").value;
        const fileInput = m.el.querySelector("#subFile");

        const payload = {
          assignment_id: assignment.id, profile_id: this.ctx.user.id,
          content, visibility, status: "submitted", submitted_at: new Date().toISOString()
        };
        // Upsert بدل insert/update منفصلين: القيد الفريد (assignment_id, profile_id) بقاعدة البيانات
        // يمنع أي تسليم مكرر حتى لو تكرر الطلب فعليًا على مستوى الـ Backend، مو بس الواجهة.
        const {data, error} = await db.from("submissions")
          .upsert(payload, {onConflict:"assignment_id,profile_id"}).select().single();
        if(error) throw error;
        const submissionId = data.id;

        if(fileInput.files[0]){
          const uploaded = await CodeUp.uploadSubmissionFile(fileInput.files[0], this.ctx.user.id, submissionId);
          const {data: fileRow, error: fErr} = await db.from("file_uploads")
            .upsert({
              course_id: course.id, uploader_id: this.ctx.user.id, related_type:"submission",
              related_id: submissionId, submission_id: submissionId, storage_path: uploaded.path,
              file_name: uploaded.name, mime_type: uploaded.type, file_size: uploaded.size,
              idempotency_key: submitIdempotencyKey
            }, {onConflict:"submission_id,idempotency_key"}).select().single();
          if(fErr) throw fErr;
          CodeUp.triggerTelegramSend(fileRow.id); // إرسال فوري لتيليجرام — لا ننتظره، ولا يوقف نجاح التسليم لو فشل
        }

        CodeUp.toast("تم إرسال التسليم بنجاح", "success");
        m.close();
        this.render();
      }catch(e){
        msgEl.className = "message show error"; msgEl.textContent = e.message || "حدث خطأ أثناء التسليم";
        submitBtn.disabled = false;
        submitBtn.textContent = "إرسال";
      }
    };
  },

  async renderTimeline(body, course, myEnrollment){
    const PAGE_SIZE = 15;
    body.innerHTML = `<div class="filterRow">
      <button data-f="all" class="active">الكل</button>
      <button data-f="mine">تسليماتي</button>
      <button data-f="squad">مجموعتي</button>
    </div><div id="timelineList"></div><div id="timelineMore"></div>`;

    const list = body.querySelector("#timelineList");
    const moreBox = body.querySelector("#timelineMore");
    let currentFilter = "all", page = 0;

    // خرائط الدور/المجموعة على مستوى الكورس (تُحسب مرة وحدة، تُستخدم لكل التعليقات بهذي الصفحة)
    const [{data: admins}, {data: squadLeaders}] = await Promise.all([
      db.from("course_admins").select("profile_id").eq("course_id", course.id),
      db.from("squad_leaders").select("profile_id, squads!inner(course_id)").eq("squads.course_id", course.id)
    ]);
    const roleById = {};
    (squadLeaders||[]).forEach(l=> roleById[l.profile_id] = "leader");
    (admins||[]).forEach(a=> roleById[a.profile_id] = "admin"); // الأدمن له أولوية على شارة القائد لو الاثنين ينطبقوا
    const {data: courseEnrollments} = await db.from("enrollments").select("profile_id, squad_id").eq("course_id", course.id);
    const squadById = Object.fromEntries((courseEnrollments||[]).map(e=>[e.profile_id, e.squad_id]));
    const mySquadId = myEnrollment?.squad_id || null;

    const load = async (filter, reset)=>{
      if(reset){ page = 0; list.innerHTML = ""; }
      moreBox.innerHTML = `<div class="emptyState">جارِ التحميل…</div>`;

      let q = db.from("submissions").select("*, assignments!inner(title,course_id), profiles(full_name,avatar_url)")
        .eq("assignments.course_id", course.id).order("created_at",{ascending:false})
        .range(page*PAGE_SIZE, page*PAGE_SIZE + PAGE_SIZE - 1);
      if(filter==="mine") q = q.eq("profile_id", this.ctx.user.id);
      else if(filter==="squad") q = q.eq("visibility","squad");
      else q = q.in("visibility",["course","squad"]).neq("profile_id","");

      const {data: posts, error} = await q;
      const safePosts = posts || [];

      let announcements = [];
      let proposals = [];
      if(page===0 && filter!=="mine"){
        const {data: annData} = await db.from("announcements").select("*, profiles(full_name)").eq("course_id", course.id).order("created_at",{ascending:false}).limit(15);
        announcements = (annData||[]).filter(a => filter!=="squad" || !a.target_squad_id || a.target_squad_id===myEnrollment?.squad_id);
        const {data: propData} = await db.from("squad_proposals").select("*, profiles(full_name)").eq("course_id", course.id).eq("status","open").order("created_at",{ascending:false}).limit(10);
        proposals = propData || [];
      }
      const {data: propVotes} = proposals.length ? await db.from("squad_proposal_votes").select("*").in("proposal_id", proposals.map(p=>p.id)) : {data:[]};

      if(page===0 && (error || !safePosts.length) && !announcements.length && !proposals.length){ list.innerHTML = `<div class="emptyState">لا توجد منشورات بعد.</div>`; moreBox.innerHTML = ""; return; }

      const {data: reactions} = await db.from("reactions").select("*").eq("target_type","submission").in("target_id", safePosts.map(p=>p.id));
      const {data: comments} = await db.from("comments").select("*, profiles(full_name)").in("submission_id", safePosts.map(p=>p.id)).order("created_at");
      const {data: postFiles} = await db.from("file_uploads").select("*").eq("related_type","submission").in("related_id", safePosts.map(p=>p.id));
      const {data: commentFiles} = await db.from("file_uploads").select("*").eq("related_type","comment").in("related_id", (comments||[]).map(c=>c.id));
      const filesByPost = {};
      for(const f of (postFiles||[])) (filesByPost[f.related_id] ||= []).push(f);
      const filesByComment = Object.fromEntries((commentFiles||[]).map(f=>[f.related_id, f]));

      const feed = [
        ...announcements.map(a=>({type:"announcement", created_at:a.created_at, data:a})),
        ...proposals.map(p=>({type:"proposal", created_at:p.created_at, data:p})),
        ...safePosts.map(p=>({type:"submission", created_at:p.created_at, data:p}))
      ].sort((x,y)=> new Date(y.created_at) - new Date(x.created_at));

      const DAY_LABELS = {sat:"سبت",sun:"أحد",mon:"اثنين",tue:"ثلاثاء",wed:"أربعاء",thu:"خميس",fri:"جمعة"};
      const html = feed.map(item=>{
        if(item.type==="announcement"){
          const a = item.data;
          return `
          <div class="timelinePost feedAnnouncement" data-announcement="${a.id}">
            <span class="feedTag">${Icon("announcement")} إعلان</span>
            <div class="meta"><b style="color:var(--ink)">${CodeUp.escapeHtml(a.profiles?.full_name||"إدارة الكورس")}</b><span class="mono">${CodeUp.timeAgo(a.created_at)}</span></div>
            <div class="body"><b>${CodeUp.escapeHtml(a.title)}</b>${a.content?`<br>${CodeUp.escapeHtml(a.content)}`:""}</div>
          </div>`;
        }
        if(item.type==="proposal"){
          const p = item.data;
          const votes = (propVotes||[]).filter(v=>v.proposal_id===p.id);
          const iVoted = votes.some(v=>v.profile_id===this.ctx.user.id);
          const daysLabel = (p.schedule_days||[]).map(d=>DAY_LABELS[d]||d).join("، ") || "غير محدد";
          const timeLabel = p.time_from && p.time_to ? `${p.time_from.slice(0,5)} - ${p.time_to.slice(0,5)}` : "";
          return `
          <div class="timelinePost feedAnnouncement" data-proposal="${p.id}">
            <span class="feedTag">${Icon("group")} اقتراح مجموعة جديدة</span>
            <div class="meta"><b style="color:var(--ink)">${CodeUp.escapeHtml(p.profiles?.full_name||"طالب")}</b><span class="mono">${CodeUp.timeAgo(p.created_at)}</span></div>
            <div class="body"><b>${CodeUp.escapeHtml(p.name)}</b><br><span class="small">${CodeUp.escapeHtml(daysLabel)}${timeLabel?" · "+timeLabel:""}</span></div>
            <div class="row" style="margin-top:8px">
              <span class="small mono">${votes.length}/${p.min_approvals} موافقين</span>
              <button class="btn ${iVoted?'':'dark'}" data-votepropose="${p.id}" ${iVoted?"disabled":""}>${iVoted?"وافقت ✓":"موافق"}</button>
            </div>
          </div>`;
        }
        const p = item.data;
        const myLiked = (reactions||[]).some(r=>r.target_id===p.id && r.user_id===this.ctx.user.id);
        const likeCount = (reactions||[]).filter(r=>r.target_id===p.id).length;
        const postComments = (comments||[]).filter(c=>c.submission_id===p.id);
        return `
        <div class="timelinePost" data-post="${p.id}">
          <span class="feedTag">${Icon("check")} تسليم واجب</span>
          <div class="meta"><b style="color:var(--ink)">${CodeUp.escapeHtml(p.profiles?.full_name||"طالب")}</b><span class="mono">${CodeUp.timeAgo(p.created_at)}</span></div>
          <div class="small mono" style="margin-bottom:6px">${CodeUp.escapeHtml(p.assignments?.title||"")}</div>
          <div class="body">${CodeUp.escapeHtml(p.content||"")}</div>
          ${(filesByPost[p.id]||[]).map(f=>renderFileCard(f,"submissions")).join("")}
          <div class="reactBar">
            <button class="reactBtn ${myLiked?'active':''}" data-like="${p.id}">إعجاب ${likeCount||""}</button>
          </div>
          ${CodeUp.buildCommentsBlock(postComments, {roleById, mySquadId, squadById, filesByComment})}
          ${commentComposerHtml(p.id)}
        </div>`;
      }).join("");
      list.insertAdjacentHTML("beforeend", html);
      wireFileCardPreviews(list);
      CodeUp.wireCommentsToggle(list);

      const requireJoin = async ()=>{
        if(myEnrollment) return true;
        if(!confirm("للتفاعل يجب الانضمام للكورس أولًا. تريد الانضمام الآن؟")) return false;
        try{ await CodeUp.rpc.enrollInCourse(course.id); this.ctx = await CodeUp.loadMyContext(); myEnrollment = this.ctx.enrollments.find(e=>e.course_id===course.id); return true; }
        catch(e){ CodeUp.toast(e.message||"تعذّر الانضمام", "error"); return false; }
      };
      list.querySelectorAll("[data-votepropose]:not([data-wired])").forEach(b=>{
        b.dataset.wired = "1";
        b.onclick = async ()=>{
          if(!(await requireJoin())) return;
          b.disabled = true;
          try{
            const {data} = await db.rpc("vote_squad_proposal", {p_proposal_id: b.dataset.votepropose});
            if(data?.status === "approved") CodeUp.toast("وصلت المجموعة للحد المطلوب — تكوّنت تلقائيًا! 🎉", "success");
            else CodeUp.toast("تم تسجيل موافقتك", "success");
            load(currentFilter, true);
          }catch(e){ CodeUp.toast(e.message,"error"); b.disabled = false; }
        };
      });
      list.querySelectorAll("[data-like]:not([data-wired])").forEach(b=>{
        b.dataset.wired = "1";
        b.onclick = async ()=>{
          if(!(await requireJoin())) return;
          try{ await CodeUp.rpc.toggleReaction("submission", b.dataset.like, "like"); load(currentFilter, true); }
          catch(e){ CodeUp.toast(e.message,"error"); }
        };
      });
      list.querySelectorAll("[data-commentsend]:not([data-wired])").forEach(b=>{
        b.dataset.wired = "1";
        const targetId = b.dataset.commentsend;
        const postCard = b.closest(".timelinePost");
        const getPendingFile = wireCommentComposer(postCard, targetId);
        b.onclick = async ()=>{
          if(!(await requireJoin())) return;
          const input = list.querySelector(`[data-commentinput="${targetId}"]`);
          const val = input.value.trim();
          const attach = getPendingFile();
          if(!val && !attach) return;
          b.disabled = true;
          try{
            const row = await CodeUp.rpc.addComment(targetId, val || "📎");
            if(attach){
              const uploaded = await CodeUp.uploadCommentAttachment(attach, this.ctx.user.id, row.id);
              const {data: fileRow} = await db.from("file_uploads").insert({
                course_id: course.id, uploader_id: this.ctx.user.id, related_type:"comment",
                related_id: row.id, storage_path: uploaded.path, file_name: uploaded.name,
                mime_type: uploaded.type, file_size: uploaded.size
              }).select().single();
              if(fileRow) CodeUp.triggerTelegramSend(fileRow.id);
            }
            input.value="";
            load(currentFilter, true);
          }catch(e){ CodeUp.toast(e.message,"error"); b.disabled = false; }
        };
      });

      if(safePosts.length === PAGE_SIZE){
        moreBox.innerHTML = `<button class="btn" id="loadMoreBtn">تحميل المزيد</button>`;
        moreBox.querySelector("#loadMoreBtn").onclick = ()=>{ page++; load(currentFilter, false); };
      }else{
        moreBox.innerHTML = "";
      }
    };

    body.querySelectorAll("[data-f]").forEach(b=>{
      b.onclick = ()=>{ currentFilter=b.dataset.f; body.querySelectorAll("[data-f]").forEach(x=>x.classList.remove("active")); b.classList.add("active"); load(currentFilter, true); };
    });
    load(currentFilter, true);
  },

  async renderSquads(body, course, myEnrollment, isAdmin, isLeader){
    const {data: squads} = await db.from("squads").select("*, squad_leaders(profile_id, profiles(full_name))").eq("course_id", course.id).eq("status","active");
    const {data: myRequests} = await db.from("squad_join_requests").select("*").eq("user_id", this.ctx.user.id).eq("status","pending");
    const pendingSquadIds = new Set((myRequests||[]).map(r=>r.squad_id));

    let html = "";
    if(!myEnrollment?.squad_id){
      html += `<div class="card2"><div class="row"><b>تريد قيادة مجموعة؟</b><button class="btn dark" id="applyLeaderBtn">تقديم طلب قيادة</button></div></div>`;
    }
    html += `<div class="card2"><div class="row"><b>ما لقيت مجموعة تناسبك؟</b><button class="btn dark" id="proposeSquadBtn">اقترح مجموعة جديدة</button></div>
      <p class="small" style="margin-top:6px">يظهر اقتراحك بالتايم لاين، ولو وافق عليه 5 طلاب على الأقل، تتكوّن المجموعة تلقائيًا وتصير قائدها.</p></div>`;

    html += `<div class="grid">` + (squads||[]).map(sq=>{
      const isMine = myEnrollment?.squad_id === sq.id;
      const pending = pendingSquadIds.has(sq.id);
      const leaders = (sq.squad_leaders||[]).map(l=>l.profiles?.full_name).filter(Boolean).join("، ") || "لا يوجد قائد بعد";
      return `
      <div class="courseCard">
        <div class="row"><h3>${CodeUp.escapeHtml(sq.name)}</h3>${isMine?'<span class="tag approved">عضو</span>':''}</div>
        <p class="small">القائد: ${CodeUp.escapeHtml(leaders)}</p>
        <p class="small">${CodeUp.escapeHtml(sq.description||"")}</p>
        ${isMine ? "" : pending
          ? `<button class="btn" disabled>طلبك قيد المراجعة</button>`
          : `<button class="btn dark" data-join="${sq.id}">طلب الانضمام</button>`}
      </div>`;
    }).join("") + `</div>`;

    body.innerHTML = html || `<div class="emptyState">لا توجد مجموعات بعد.</div>`;

    const applyBtn = body.querySelector("#applyLeaderBtn");
    if(applyBtn) applyBtn.onclick = ()=> this.openLeaderApplicationModal(course);
    body.querySelector("#proposeSquadBtn").onclick = ()=> this.openProposeSquadModal(course, myEnrollment);

    body.querySelectorAll("[data-join]").forEach(b=>{
      b.onclick = async ()=>{
        if(!myEnrollment){
          if(!confirm("للانضمام لمجموعة يجب الانضمام للكورس أولًا. تريد الانضمام الآن؟")) return;
          try{ await CodeUp.rpc.enrollInCourse(course.id); this.ctx = await CodeUp.loadMyContext(); }
          catch(e){ CodeUp.toast(e.message||"تعذّر الانضمام", "error"); return; }
        }
        b.disabled = true;
        try{
          await CodeUp.rpc.requestJoinSquad(b.dataset.join);
          CodeUp.toast("تم إرسال طلب الانضمام", "success");
          this.render();
        }catch(e){ CodeUp.toast(e.message, "error"); b.disabled = false; }
      };
    });
  },

  openLeaderApplicationModal(course){
    const m = this.modal(`
      <h3>طلب قيادة مجموعة</h3>
      <label>لماذا تريد أن تكون قائد مجموعة؟</label>
      <textarea id="leadMsg" rows="3"></textarea>
      <label>خبرتك السابقة (إن وجدت)</label>
      <textarea id="leadExp" rows="3"></textarea>
      <button class="primary" id="leadSendBtn">إرسال الطلب</button>
      <div id="leadMsgBox" class="message"></div>
    `);
    m.el.querySelector("#leadSendBtn").onclick = async ()=>{
      const box = m.el.querySelector("#leadMsgBox");
      try{
        await CodeUp.rpc.applyForLeader(course.id, null, m.el.querySelector("#leadMsg").value.trim(), m.el.querySelector("#leadExp").value.trim());
        CodeUp.toast("تم إرسال طلب القيادة", "success");
        m.close();
      }catch(e){ box.className="message show error"; box.textContent = e.message; }
    };
  },

  openProposeSquadModal(course, myEnrollment){
    const DAYS = [["sat","سبت"],["sun","أحد"],["mon","اثنين"],["tue","ثلاثاء"],["wed","أربعاء"],["thu","خميس"],["fri","جمعة"]];
    const m = this.modal(`
      <h3>اقتراح مجموعة جديدة</h3>
      <label>اسم المجموعة</label>
      <input id="propName" placeholder="مثلاً: مجموعة المساء">
      <label>أيام اللقاء</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin:6px 0">
        ${DAYS.map(([key,label])=>`<label style="display:flex;align-items:center;gap:4px;font-size:13px">
          <input type="checkbox" data-propday value="${key}"> ${label}
        </label>`).join("")}
      </div>
      <label>من الساعة</label><input id="propFrom" type="time">
      <label>إلى الساعة</label><input id="propTo" type="time">
      <p class="small" style="margin-top:8px">هيظهر اقتراحك بالتايم لاين، ولو وافق عليه 5 طلاب على الأقل، تتكوّن المجموعة تلقائيًا وتصير قائدها. أنت أول موافق تلقائيًا.</p>
      <button class="primary" id="propSendBtn">نشر الاقتراح</button>
      <div id="propMsgBox" class="message"></div>
    `);
    m.el.querySelector("#propSendBtn").onclick = async ()=>{
      const box = m.el.querySelector("#propMsgBox");
      const name = m.el.querySelector("#propName").value.trim();
      if(!name){ box.className="message show error"; box.textContent="اسم المجموعة إلزامي"; return; }
      if(!myEnrollment){ box.className="message show error"; box.textContent="لازم تكون منضم للكورس أولًا"; return; }
      const days = [...m.el.querySelectorAll("[data-propday]:checked")].map(cb=>cb.value);
      const btn = m.el.querySelector("#propSendBtn");
      btn.disabled = true;
      try{
        const {data: prop, error} = await db.from("squad_proposals").insert({
          course_id: course.id, proposed_by: this.ctx.user.id, name,
          schedule_days: days, time_from: m.el.querySelector("#propFrom").value || null,
          time_to: m.el.querySelector("#propTo").value || null
        }).select().single();
        if(error) throw error;
        await db.rpc("vote_squad_proposal", {p_proposal_id: prop.id});
        CodeUp.toast("تم نشر الاقتراح — شاركه مع زملائك!", "success");
        m.close();
        this.go({name:"course", courseId: course.id, courseSlug: course.slug, tab:"timeline"});
      }catch(e){ box.className="message show error"; box.textContent = e.message; btn.disabled=false; }
    };
  },

  async renderProgress(body, course, myEnrollment){
    if(!myEnrollment){ body.innerHTML = `<div class="emptyState">جارِ تسجيلك في الكورس…</div>`; return; }
    body.innerHTML = `
      <div class="grid">
        <div class="box"><span class="eyebrow">التقدم</span><p style="font-size:26px;margin:8px 0 0;font-weight:700">${myEnrollment.progress}%</p></div>
        <div class="box"><span class="eyebrow">XP</span><p style="font-size:26px;margin:8px 0 0;font-weight:700">${myEnrollment.xp}</p></div>
        <div class="box"><span class="eyebrow">Streak</span><p style="font-size:26px;margin:8px 0 0;font-weight:700">${myEnrollment.streak}</p></div>
        <div class="box"><span class="eyebrow">مكتمل</span><p style="font-size:26px;margin:8px 0 0;font-weight:700">${myEnrollment.completed_count}</p></div>
      </div>`;
  },

  async renderLeaderboard(body, course){
    const {data} = await db.from("enrollments").select("xp, progress, profiles(full_name)").eq("course_id", course.id).order("xp",{ascending:false}).limit(20);
    if(!data || !data.length){ body.innerHTML = `<div class="emptyState">لا توجد بيانات بعد.</div>`; return; }
    body.innerHTML = `<div class="card2">` + data.map((e,i)=>`
      <div class="row" style="padding:8px 0;${i? 'border-top:1px dashed rgba(255,255,255,.12)':''}">
        <span><span class="mono small">#${i+1}</span> ${CodeUp.escapeHtml(e.profiles?.full_name||"طالب")}</span>
        <span class="small mono">${e.xp} XP · ${e.progress}%</span>
      </div>`).join("") + `</div>`;
  }
};

function statusLabel(s){
  return {on_track:"على المسار",at_risk:"في خطر",behind:"متأخر",inactive:"غير نشط",
    submitted:"تم التسليم",late:"متأخر",missing:"لم يُسلَّم",reviewed:"تمت المراجعة"}[s] || s;
}
</script>
</body>
</html>
