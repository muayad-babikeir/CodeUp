<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeUp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== CodeUp — نظام تصميم داكن مستوحى من لوحات ألوان @graphix_theory =====
   Onyx (خلفية) + Candy Blue (أساسي) + Lime (XP/نجاح) + Violet (ثانوي/قيادة) */
:root{
  --bg0:#020204; --bg1:#0B0C10; --bg2:#131620;
  --ink:#F3F5FA; --ink60:#9AA0B4; --ink40:#666C82;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
  --surface:rgba(255,255,255,.045); --surface-solid:#111319;
  --accent:#B7D8EC; --accent-ink:#0B0C10; --accent-deep:#3E7CA6;
  --lime:#C6FF34; --lime-ink:#131A02;
  --violet:#8A6FC9; --violet-soft:rgba(138,111,201,.16);
  --teal:#79D6C4; --amber:#F0B429; --red:#F2555F;
  --blur:blur(22px);
  --shadow:0 24px 60px -24px rgba(0,0,0,.65);
}
*{box-sizing:border-box; min-width:0}
body{
  margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);line-height:1.55;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(183,216,236,.10), transparent 60%),
    radial-gradient(700px 500px at 110% 10%, rgba(138,111,201,.14), transparent 55%),
    radial-gradient(600px 420px at 50% 120%, rgba(198,255,52,.06), transparent 60%),
    var(--bg0);
  background-attachment:fixed;
}
.mono{font-family:'IBM Plex Mono',monospace}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:.02em;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:var(--ink60);background:rgba(255,255,255,.03);white-space:nowrap}
.tag.on_track,.tag.active,.tag.approved{background:rgba(198,255,52,.1);color:var(--lime);border-color:rgba(198,255,52,.28)}
.tag.at_risk,.tag.pending{background:rgba(240,180,41,.1);color:var(--amber);border-color:rgba(240,180,41,.28)}
.tag.behind,.tag.rejected{background:rgba(242,85,95,.1);color:var(--red);border-color:rgba(242,85,95,.28)}
.tag.inactive,.tag.missing{background:rgba(255,255,255,.04);color:var(--ink60);border-color:var(--line)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.eyebrow::before{content:"> ";color:var(--ink40)}
.app{min-height:100vh;display:grid;place-items:center;padding:18px}
.card{width:min(440px,100%);background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.brand{text-align:center;margin-bottom:26px}
.brand .mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(155deg,var(--accent),var(--violet));color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 14px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:19px}
.brand h1{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.brand p{margin:0;color:var(--ink60);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.04);padding:4px;border-radius:12px;margin-bottom:22px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:11px;border-radius:9px;cursor:pointer;color:var(--ink60);font-family:inherit;font-size:14px}
.tabs button.active{background:var(--ink);color:var(--bg0);box-shadow:0 1px 3px rgba(0,0,0,.3);font-weight:600}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--ink)}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;outline:0;font-family:inherit;font-size:14px;background:rgba(255,255,255,.03);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink40)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(183,216,236,.15)}
.primary{width:100%;border:0;border-radius:12px;padding:13px;margin-top:20px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:var(--accent-ink);font-weight:700;font-family:inherit;font-size:14.5px;cursor:pointer}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.6}
.message.show{display:block}.message.error{background:rgba(242,85,95,.12);color:var(--red)}.message.success{background:rgba(121,214,196,.12);color:var(--teal)}
.hidden{display:none!important}
.pwdWrap{position:relative}.pwdWrap input{padding-left:44px}
.pwdToggle{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:8px;color:var(--ink60)}
.pwdToggle:hover{background:rgba(255,255,255,.06)}.pwdToggle svg{width:19px;height:19px}.pwdToggle .eyeOff{display:none}.pwdToggle.show .eyeOn{display:none}.pwdToggle.show .eyeOff{display:block}
.spinner{display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(11,12,16,.3);border-top-color:var(--accent-ink);animation:spin .7s linear infinite;margin:0 auto}
.primary.loading .btnText{display:none}.primary.loading .spinner{display:block}@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.dashboard{min-height:100vh;padding:16px}
.wrap{max-width:1080px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:18px;padding:12px 16px;position:sticky;top:10px;z-index:20}
.topbrand{display:flex;align-items:center;gap:9px;font-weight:700;flex-shrink:0}
.topbrand .mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(155deg,var(--accent),var(--violet));color:var(--accent-ink);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px}
.topRight{display:flex;align-items:center;gap:8px;flex-shrink:0}
.iconBtn{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconBtn svg{width:19px;height:19px}
.badge{position:absolute;top:-5px;left:-5px;background:var(--red);color:#fff;font-size:10.5px;border-radius:999px;padding:1px 5px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.logout{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink)}
.logout:hover{border-color:var(--line-strong)}
.welcome{max-width:1080px;margin:24px auto 4px}
.welcome h2{font-size:25px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.welcome p{color:var(--ink60);font-size:14px;margin:0}
.sectionHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px;flex-wrap:wrap}
.sectionHead h3{font-size:15px;margin:0;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.box{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:18px;padding:18px}
@media(max-width:500px){.card{padding:26px 20px}}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--ink60);font-size:13.5px;margin:14px 0;flex-wrap:wrap}
.crumbs button{border:0;background:transparent;color:var(--accent);cursor:pointer;font-weight:600;padding:0;font-family:inherit;font-size:13.5px}
.courseCard{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:border-color .15s,transform .15s;overflow:hidden}
.courseCard:hover{border-color:var(--accent);transform:translateY(-2px)}
.courseCard h3{margin:0 0 6px;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.courseCard p{margin:0;color:var(--ink60);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subtabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:14px;padding:5px;margin:14px 0;scrollbar-width:thin}
.subtabs button{white-space:nowrap;border:0;background:transparent;padding:9px 13px;border-radius:10px;cursor:pointer;color:var(--ink60);font-weight:600;font-family:inherit;font-size:13.5px;flex-shrink:0}
.subtabs button.active{background:var(--ink);color:var(--bg0)}
.card2{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row > *{min-width:0}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;font-family:inherit;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.dark{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.dark:hover{filter:brightness(1.08)}
.btn.danger{background:rgba(242,85,95,.1);color:var(--red);border-color:rgba(242,85,95,.28)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.small{font-size:12.5px;color:var(--ink60)}
.emptyState{text-align:center;padding:36px 16px;color:var(--ink60);font-size:13.5px}
.modalBg{position:fixed;inset:0;background:rgba(2,2,4,.68);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.modal{background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:20px;padding:22px;width:min(460px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal h3{margin-top:0;font-size:16px}
.timelinePost{background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.timelinePost .meta{display:flex;justify-content:space-between;gap:8px;color:var(--ink60);font-size:12.5px;margin-bottom:8px;flex-wrap:wrap}
.timelinePost .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.reactBar{display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.reactBtn{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:9px;padding:6px 11px;cursor:pointer;font-size:12.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink)}
.reactBtn.active{background:var(--violet-soft);border-color:var(--violet);color:#D9CFF2}
.commentBox{margin-top:10px;display:flex;gap:8px}
.commentBox input{flex:1;min-width:0}
.comment{font-size:12.5px;padding:8px 0;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.filterRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filterRow button{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.filterRow button.active{background:var(--ink);color:var(--bg0);border-color:var(--ink)}
/* شارات XP/Streak — تستخدم Lime كلون نجاح/طاقة مميز عن باقي الحالات */
.xpPill{display:inline-flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;color:var(--lime-ink);background:var(--lime);padding:3px 9px;border-radius:999px}
</style>
</head>
<body>
<div id="authApp" class="app">
<main class="card">
<div class="brand">
<div class="mark">&lt;/&gt;</div>
<h1>CodeUp</h1><p>منصة التعلم والتدريب البرمجي</p>
</div>
<div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="signupTab">إنشاء حساب</button></div>
<form id="authForm">
<div id="nameGroup" class="hidden"><label>الاسم الكامل</label><input id="fullName" type="text" autocomplete="name" placeholder="اكتب اسمك"></div>
<label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="example@email.com" required style="direction:ltr;text-align:left">
<label>كلمة المرور</label>
<div class="pwdWrap">
<input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="••••••••" required style="direction:ltr;text-align:left">
<button type="button" id="pwdToggle" class="pwdToggle" aria-label="إظهار كلمة المرور">
<svg class="eyeOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.5 21.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
</button>
</div>
<button id="submitBtn" class="primary" type="submit"><span class="btnText">تسجيل الدخول</span><span class="spinner"></span></button>
</form>
<div id="message" class="message"></div>
</main>
</div>

<div id="dashboardApp" class="dashboard hidden">
<div class="topbar wrap">
<div class="topbrand"><div class="mark">&lt;/&gt;</div><span>CodeUp</span></div>
<div class="topRight">
<button class="iconBtn" id="notifBtn" title="الإشعارات" aria-label="الإشعارات">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
<span id="notifBadge" class="badge hidden">0</span>
</button>
<button id="logoutBtn" class="logout">تسجيل الخروج</button>
</div>
</div>

<div class="wrap">
<div id="crumbs" class="crumbs hidden"><button id="crumbHome">الرئيسية</button></div>
<div id="viewRoot"></div>
</div>
</div>

<script src="js/supabase.js"></script>
<script src="js/shared.js"></script>
<script>
const authApp=document.getElementById("authApp"),dash=document.getElementById("dashboardApp"),form=document.getElementById("authForm"),msg=document.getElementById("message"),btn=document.getElementById("submitBtn");
let mode="login";
function setMode(m){mode=m;loginTab.classList.toggle("active",m==="login");signupTab.classList.toggle("active",m==="signup");nameGroup.classList.toggle("hidden",m!=="signup");btn.querySelector(".btnText").textContent=m==="signup"?"إنشاء الحساب":"تسجيل الدخول";msg.className="message"}
function message(t,c="error"){msg.textContent=t;msg.className="message show "+c}
loginTab.onclick=()=>setMode("login");signupTab.onclick=()=>setMode("signup");
const pwdInput=document.getElementById("password"),pwdToggle=document.getElementById("pwdToggle");
pwdToggle.onclick=()=>{const show=pwdInput.type==="password";pwdInput.type=show?"text":"password";pwdToggle.classList.toggle("show",show);pwdToggle.setAttribute("aria-label",show?"إخفاء كلمة المرور":"إظهار كلمة المرور")};

function cleanEmail(raw){
  return raw.normalize("NFKC").replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069]/g,"").trim();
}

form.onsubmit=async e=>{
  e.preventDefault();btn.disabled=true;btn.classList.add("loading");msg.className="message";
  try{
    let email=cleanEmail(document.getElementById("email").value),password=document.getElementById("password").value;
    if(mode==="signup"){
      let name=fullName.value.trim();if(!name){message("اكتب اسمك أولاً.");btn.disabled=false;btn.classList.remove("loading");return}
      let{data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});
      if(error)throw error;
      if(data.session)await bootApp(data.user);else message("تم إنشاء الحساب. تحقق من بريدك الإلكتروني إذا كان تأكيد البريد مفعلاً.","success");
    }else{
      let{data,error}=await db.auth.signInWithPassword({email,password});
      if(error)throw error;
      await bootApp(data.user);
    }
  }catch(e){message(e.message||"حدث خطأ غير متوقع")}
  finally{btn.disabled=false;btn.classList.remove("loading")}
};
logoutBtn.onclick=async()=>{await db.auth.signOut();dash.classList.add("hidden");authApp.classList.remove("hidden");setMode("login");App.ctx=null};
(async()=>{let{data}=await db.auth.getSession();if(data.session)await bootApp(data.session.user)})();

async function bootApp(user){
  authApp.classList.add("hidden");dash.classList.remove("hidden");
  await App.init(user);
}

const App = {
  ctx: null,
  view: {name:"home"},
  root: document.getElementById("viewRoot"),
  crumbs: document.getElementById("crumbs"),

  async init(user){
    this.ctx = await CodeUp.loadMyContext();
    document.getElementById("crumbHome").onclick = ()=>{this.go({name:"home"})};
    document.getElementById("notifBtn").onclick = ()=>this.openNotifications();
    this.refreshNotifBadge();
    CodeUp.subscribeToMyNotifications(user.id, (n)=>{ this.refreshNotifBadge(); CodeUp.toast(n.title, "info"); });
    this.go({name:"home"});
  },

  go(view){ this.view = view; this.render(); },

  crumbTrail(items){
    this.crumbs.classList.remove("hidden");
    const home = this.crumbs.querySelector("#crumbHome");
    this.crumbs.innerHTML = "";
    this.crumbs.appendChild(home);
    items.forEach(it=>{
      const sep=document.createElement("span");sep.textContent="/";sep.className="mono";this.crumbs.appendChild(sep);
      const b=document.createElement("button");b.textContent=it.label;b.onclick=it.onClick;this.crumbs.appendChild(b);
    });
  },

  async refreshNotifBadge(){
    const {count} = await db.from("notifications").select("id",{count:"exact",head:true}).eq("profile_id", this.ctx.user.id).eq("is_read", false);
    const badge=document.getElementById("notifBadge");
    if(count>0){badge.textContent=count>9?"9+":count;badge.classList.remove("hidden")}else badge.classList.add("hidden");
  },

  async openNotifications(){
    const {data} = await db.from("notifications").select("*").eq("profile_id", this.ctx.user.id).order("created_at",{ascending:false}).limit(20);
    const list = (data||[]).map(n=>`
      <div class="card2" style="${n.is_read?'':'background:rgba(138,111,201,.14)'}">
        <div class="row"><b style="font-size:13.5px">${CodeUp.escapeHtml(n.title)}</b><span class="small mono">${CodeUp.timeAgo(n.created_at)}</span></div>
        <div class="small" style="margin-top:6px">${CodeUp.escapeHtml(n.body||"")}</div>
      </div>`).join("") || `<div class="emptyState">لا توجد إشعارات بعد.</div>`;
    this.modal(`<h3>الإشعارات</h3><div>${list}</div>`, async ()=>{
      const ids=(data||[]).filter(n=>!n.is_read).map(n=>n.id);
      if(ids.length) await db.from("notifications").update({is_read:true}).in("id", ids);
      this.refreshNotifBadge();
    });
  },

  modal(innerHtml, onClose){
    const bg=document.createElement("div");bg.className="modalBg";
    bg.innerHTML=`<div class="modal">${innerHtml}<div style="margin-top:16px;text-align:end"><button class="btn" id="modalClose">إغلاق</button></div></div>`;
    document.body.appendChild(bg);
    bg.addEventListener("click",e=>{if(e.target===bg)close()});
    function close(){bg.remove();if(onClose)onClose();}
    bg.querySelector("#modalClose").onclick=close;
    return {close, el:bg};
  },

  async render(){
    this.root.innerHTML = `<div class="emptyState">جارِ التحميل…</div>`;
    if(this.view.name==="home") return this.renderHome();
    if(this.view.name==="course") return this.renderCourse(this.view.courseId, this.view.tab||"learning");
  },

  async renderHome(){
    this.crumbs.classList.add("hidden");
    const {data: courses} = await db.from("courses").select("*").eq("status","published").order("created_at");
    const enrolledIds = new Set(this.ctx.enrollments.map(e=>e.course_id));
    const myCourses = this.ctx.enrollments;

    let html = `<section class="welcome"><h2>مرحباً ${CodeUp.escapeHtml(this.ctx.profile.full_name||"")}</h2><p class="mono">${CodeUp.escapeHtml(this.ctx.user.email||"")}</p></section>`;

    if(myCourses.length){
      html += `<div class="sectionHead"><h3 class="eyebrow">كورساتي</h3></div><div class="grid">`;
      html += myCourses.map(e=>`
        <div class="courseCard" data-course="${e.course_id}">
          <div class="row"><h3>${CodeUp.escapeHtml(e.courses?.name||"")}</h3><span class="tag ${e.status}">${statusLabel(e.status)}</span></div>
          <p>${e.squads?CodeUp.escapeHtml(e.squads.name):"بلا مجموعة بعد"}</p>
          <p class="small mono" style="margin-top:8px">تقدم ${e.progress}% · ${e.xp} XP · streak ${e.streak}</p>
        </div>`).join("");
      html += `</div>`;
    }

    const otherCourses = (courses||[]).filter(c=>!enrolledIds.has(c.id));
    if(otherCourses.length){
      html += `<div class="sectionHead"><h3 class="eyebrow">كورسات متاحة</h3></div><div class="grid">`;
      html += otherCourses.map(c=>`
        <div class="courseCard" data-course="${c.id}">
          <h3>${CodeUp.escapeHtml(c.name)}</h3>
          <p>${CodeUp.escapeHtml(c.description||"")}</p>
        </div>`).join("");
      html += `</div>`;
    }

    if(!myCourses.length && !otherCourses.length){
      html += `<div class="emptyState">لا توجد كورسات متاحة حاليًا.</div>`;
    }

    this.root.innerHTML = html;
    this.root.querySelectorAll(".courseCard").forEach(el=>{
      el.onclick = ()=> this.go({name:"course", courseId: el.dataset.course, tab:"learning"});
    });
  },

  async renderCourse(courseId, tab){
    const {data: course} = await db.from("courses").select("*").eq("id", courseId).single();
    if(!course){ this.root.innerHTML = `<div class="emptyState">الكورس غير موجود.</div>`; return; }

    let myEnrollment = this.ctx.enrollments.find(e=>e.course_id===courseId);
    if(!myEnrollment){
      try{
        await CodeUp.rpc.enrollInCourse(courseId);
        this.ctx = await CodeUp.loadMyContext();
        myEnrollment = this.ctx.enrollments.find(e=>e.course_id===courseId);
      }catch(e){ CodeUp.toast(e.message || "تعذّر تسجيلك في الكورس", "error"); }
    }

    this.crumbTrail([{label: course.name, onClick: ()=>this.go({name:"course",courseId,tab:"learning"})}]);

    const isAdmin = this.ctx.courseAdminCourseIds.includes(courseId);
    const isLeader = this.ctx.leaderCourseIds.includes(courseId);

    const tabs = [
      ["learning","التعلم"],["assignments","الواجبات"],["timeline","المستجدات"],
      ["squads","المجموعات"],["progress","تقدمي"],["leaderboard","المتصدرون"]
    ];
    let html = `<div class="subtabs">` + tabs.map(([key,label])=>
      `<button data-tab="${key}" class="${tab===key?'active':''}">${label}</button>`).join("") + `</div><div id="tabBody"></div>`;
    this.root.innerHTML = html;
    this.root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>this.go({name:"course",courseId,tab:b.dataset.tab}));

    const body = document.getElementById("tabBody");
    body.innerHTML = `<div class="emptyState">جارِ التحميل…</div>`;

    if(tab==="learning") return this.renderLearning(body, course);
    if(tab==="assignments") return this.renderAssignments(body, course, myEnrollment);
    if(tab==="timeline") return this.renderTimeline(body, course, myEnrollment);
    if(tab==="squads") return this.renderSquads(body, course, myEnrollment, isAdmin, isLeader);
    if(tab==="progress") return this.renderProgress(body, course, myEnrollment);
    if(tab==="leaderboard") return this.renderLeaderboard(body, course);
  },

  async renderLearning(body, course){
    const {data: units} = await db.from("units").select("*, lessons(*)").eq("course_id", course.id).order("order_index");
    if(!units || !units.length){ body.innerHTML = `<div class="emptyState">لا يوجد محتوى تعليمي منشور بعد.</div>`; return; }
    body.innerHTML = units.map(u=>`
      <div class="card2">
        <b>${CodeUp.escapeHtml(u.title)}</b>
        <div style="margin-top:8px">
          ${(u.lessons||[]).sort((a,b)=>a.order_index-b.order_index).map(l=>`
            <div class="row" style="padding:8px 0;border-top:1px dashed rgba(255,255,255,.12)">
              <span>${CodeUp.escapeHtml(l.title)}</span>
              ${l.video_url?`<a href="${l.video_url}" target="_blank" class="btn">مشاهدة</a>`:""}
            </div>`).join("") || `<p class="small">لا توجد دروس بعد.</p>`}
        </div>
      </div>`).join("");
  },

  async renderAssignments(body, course, myEnrollment){
    const {data: assignments} = await db.from("assignments").select("*").eq("course_id", course.id).order("deadline");
    if(!assignments || !assignments.length){ body.innerHTML = `<div class="emptyState">لا توجد واجبات بعد.</div>`; return; }

    const {data: mySubs} = await db.from("submissions").select("*").eq("profile_id", this.ctx.user.id).in("assignment_id", assignments.map(a=>a.id));
    const subByAssignment = Object.fromEntries((mySubs||[]).map(s=>[s.assignment_id, s]));

    body.innerHTML = assignments.map(a=>{
      const sub = subByAssignment[a.id];
      const status = sub ? sub.status : "missing";
      return `
      <div class="card2">
        <div class="row"><b>${CodeUp.escapeHtml(a.title)}</b><span class="tag ${status}">${statusLabel(status)}</span></div>
        <p class="small">${CodeUp.escapeHtml(a.description||"")}</p>
        <p class="small mono">deadline: ${CodeUp.formatDate(a.deadline)}</p>
        <div class="row" style="margin-top:8px">
          <span class="small">${sub?`قدّمت ${CodeUp.timeAgo(sub.submitted_at)}${sub.grade!=null?` · الدرجة ${sub.grade}`:""}`:"لم تُقدّم بعد"}</span>
          <button class="btn dark" data-submit="${a.id}">${sub?"تعديل التسليم":"تسليم الواجب"}</button>
        </div>
      </div>`;
    }).join("");

    body.querySelectorAll("[data-submit]").forEach(b=>{
      b.onclick = ()=> this.openSubmitModal(assignments.find(a=>a.id===b.dataset.submit), course, subByAssignment[b.dataset.submit]);
    });
  },

  openSubmitModal(assignment, course, existing){
    const m = this.modal(`
      <h3>تسليم: ${CodeUp.escapeHtml(assignment.title)}</h3>
      <label>ملاحظات/شرح (اختياري)</label>
      <textarea id="subContent" rows="4">${CodeUp.escapeHtml(existing?.content||"")}</textarea>
      <label>الملف</label>
      <input type="file" id="subFile">
      <label>مشاركة في المستجدات</label>
      <select id="subVisibility">
        <option value="private" ${existing?.visibility==="private"?"selected":""}>خاص — لا يظهر لأحد</option>
        <option value="squad" ${existing?.visibility==="squad"?"selected":""}>مجموعتي فقط</option>
        <option value="course" ${existing?.visibility==="course"?"selected":""}>كل الكورس</option>
      </select>
      <button class="primary" id="subSubmitBtn">إرسال</button>
      <div id="subMsg" class="message"></div>
    `);
    m.el.querySelector("#subSubmitBtn").onclick = async ()=>{
      const msgEl = m.el.querySelector("#subMsg");
      const submitBtn = m.el.querySelector("#subSubmitBtn");
      submitBtn.disabled = true;
      try{
        const content = m.el.querySelector("#subContent").value.trim();
        const visibility = m.el.querySelector("#subVisibility").value;
        const fileInput = m.el.querySelector("#subFile");

        let submissionId = existing?.id;
        const payload = {
          assignment_id: assignment.id, profile_id: this.ctx.user.id,
          content, visibility, status: "submitted", submitted_at: new Date().toISOString()
        };

        if(submissionId){
          await db.from("submissions").update(payload).eq("id", submissionId);
        }else{
          const {data, error} = await db.from("submissions").insert(payload).select().single();
          if(error) throw error;
          submissionId = data.id;
        }

        if(fileInput.files[0]){
          const path = await CodeUp.uploadSubmissionFile(fileInput.files[0], this.ctx.user.id, submissionId);
          await db.from("file_uploads").insert({
            course_id: course.id, uploader_id: this.ctx.user.id, related_type:"submission",
            related_id: submissionId, submission_id: submissionId, storage_path: path,
            file_name: fileInput.files[0].name, mime_type: fileInput.files[0].type, file_size: fileInput.files[0].size
          });
        }

        CodeUp.toast("تم إرسال التسليم بنجاح", "success");
        m.close();
        this.render();
      }catch(e){
        msgEl.className = "message show error"; msgEl.textContent = e.message || "حدث خطأ أثناء التسليم";
      }finally{ submitBtn.disabled = false; }
    };
  },

  async renderTimeline(body, course, myEnrollment){
    body.innerHTML = `<div class="filterRow">
      <button data-f="all" class="active">الكل</button>
      <button data-f="mine">تسليماتي</button>
      <button data-f="squad">مجموعتي</button>
    </div><div id="timelineList"><div class="emptyState">جارِ التحميل…</div></div>`;

    const list = body.querySelector("#timelineList");
    const load = async (filter)=>{
      let q = db.from("submissions").select("*, assignments!inner(title,course_id), profiles(full_name,avatar_url)")
        .eq("assignments.course_id", course.id).order("created_at",{ascending:false}).limit(30);
      if(filter==="mine") q = q.eq("profile_id", this.ctx.user.id);
      else if(filter==="squad") q = q.eq("visibility","squad");
      else q = q.in("visibility",["course","squad"]).neq("profile_id","");

      const {data: posts, error} = await q;
      if(error || !posts || !posts.length){ list.innerHTML = `<div class="emptyState">لا توجد منشورات بعد.</div>`; return; }

      const {data: reactions} = await db.from("reactions").select("*").eq("target_type","submission").in("target_id", posts.map(p=>p.id));
      const {data: comments} = await db.from("comments").select("*, profiles(full_name)").in("submission_id", posts.map(p=>p.id)).order("created_at");

      list.innerHTML = posts.map(p=>{
        const myLiked = (reactions||[]).some(r=>r.target_id===p.id && r.user_id===this.ctx.user.id);
        const likeCount = (reactions||[]).filter(r=>r.target_id===p.id).length;
        const postComments = (comments||[]).filter(c=>c.submission_id===p.id);
        return `
        <div class="timelinePost" data-post="${p.id}">
          <div class="meta"><b style="color:var(--ink)">${CodeUp.escapeHtml(p.profiles?.full_name||"طالب")}</b><span class="mono">${CodeUp.timeAgo(p.created_at)}</span></div>
          <div class="small mono" style="margin-bottom:6px">${CodeUp.escapeHtml(p.assignments?.title||"")}</div>
          <div class="body">${CodeUp.escapeHtml(p.content||"")}</div>
          <div class="reactBar">
            <button class="reactBtn ${myLiked?'active':''}" data-like="${p.id}">إعجاب ${likeCount||""}</button>
          </div>
          <div class="commentsList">
            ${postComments.map(c=>`<div class="comment"><b>${CodeUp.escapeHtml(c.profiles?.full_name||"")}</b>: ${CodeUp.escapeHtml(c.content)}</div>`).join("")}
          </div>
          <div class="commentBox">
            <input type="text" placeholder="اكتب تعليقًا…" data-commentinput="${p.id}">
            <button class="btn" data-commentsend="${p.id}">إرسال</button>
          </div>
        </div>`;
      }).join("");

      list.querySelectorAll("[data-like]").forEach(b=>{
        b.onclick = async ()=>{
          try{ await CodeUp.rpc.toggleReaction("submission", b.dataset.like, "like"); load(currentFilter); }
          catch(e){ CodeUp.toast(e.message,"error"); }
        };
      });
      list.querySelectorAll("[data-commentsend]").forEach(b=>{
        b.onclick = async ()=>{
          const input = list.querySelector(`[data-commentinput="${b.dataset.commentsend}"]`);
          const val = input.value.trim(); if(!val) return;
          try{ await CodeUp.rpc.addComment(b.dataset.commentsend, val); input.value=""; load(currentFilter); }
          catch(e){ CodeUp.toast(e.message,"error"); }
        };
      });
    };

    let currentFilter = "all";
    body.querySelectorAll("[data-f]").forEach(b=>{
      b.onclick = ()=>{ currentFilter=b.dataset.f; body.querySelectorAll("[data-f]").forEach(x=>x.classList.remove("active")); b.classList.add("active"); load(currentFilter); };
    });
    load(currentFilter);
  },

  async renderSquads(body, course, myEnrollment, isAdmin, isLeader){
    const {data: squads} = await db.from("squads").select("*, squad_leaders(profile_id, profiles(full_name))").eq("course_id", course.id).eq("status","active");
    const {data: myRequests} = await db.from("squad_join_requests").select("*").eq("user_id", this.ctx.user.id).eq("status","pending");
    const pendingSquadIds = new Set((myRequests||[]).map(r=>r.squad_id));

    let html = "";
    if(!myEnrollment?.squad_id){
      html += `<div class="card2"><div class="row"><b>تريد قيادة مجموعة؟</b><button class="btn dark" id="applyLeaderBtn">تقديم طلب قيادة</button></div></div>`;
    }

    html += `<div class="grid">` + (squads||[]).map(sq=>{
      const isMine = myEnrollment?.squad_id === sq.id;
      const pending = pendingSquadIds.has(sq.id);
      const leaders = (sq.squad_leaders||[]).map(l=>l.profiles?.full_name).filter(Boolean).join("، ") || "لا يوجد قائد بعد";
      return `
      <div class="courseCard">
        <div class="row"><h3>${CodeUp.escapeHtml(sq.name)}</h3>${isMine?'<span class="tag approved">عضو</span>':''}</div>
        <p class="small">القائد: ${CodeUp.escapeHtml(leaders)}</p>
        <p class="small">${CodeUp.escapeHtml(sq.description||"")}</p>
        ${isMine ? "" : pending
          ? `<button class="btn" disabled>طلبك قيد المراجعة</button>`
          : `<button class="btn dark" data-join="${sq.id}">طلب الانضمام</button>`}
      </div>`;
    }).join("") + `</div>`;

    body.innerHTML = html || `<div class="emptyState">لا توجد مجموعات بعد.</div>`;

    const applyBtn = body.querySelector("#applyLeaderBtn");
    if(applyBtn) applyBtn.onclick = ()=> this.openLeaderApplicationModal(course);

    body.querySelectorAll("[data-join]").forEach(b=>{
      b.onclick = async ()=>{
        b.disabled = true;
        try{
          await CodeUp.rpc.requestJoinSquad(b.dataset.join);
          CodeUp.toast("تم إرسال طلب الانضمام", "success");
          this.render();
        }catch(e){ CodeUp.toast(e.message, "error"); b.disabled = false; }
      };
    });
  },

  openLeaderApplicationModal(course){
    const m = this.modal(`
      <h3>طلب قيادة مجموعة</h3>
      <label>لماذا تريد أن تكون قائد مجموعة؟</label>
      <textarea id="leadMsg" rows="3"></textarea>
      <label>خبرتك السابقة (إن وجدت)</label>
      <textarea id="leadExp" rows="3"></textarea>
      <button class="primary" id="leadSendBtn">إرسال الطلب</button>
      <div id="leadMsgBox" class="message"></div>
    `);
    m.el.querySelector("#leadSendBtn").onclick = async ()=>{
      const box = m.el.querySelector("#leadMsgBox");
      try{
        await CodeUp.rpc.applyForLeader(course.id, null, m.el.querySelector("#leadMsg").value.trim(), m.el.querySelector("#leadExp").value.trim());
        CodeUp.toast("تم إرسال طلب القيادة", "success");
        m.close();
      }catch(e){ box.className="message show error"; box.textContent = e.message; }
    };
  },

  async renderProgress(body, course, myEnrollment){
    if(!myEnrollment){ body.innerHTML = `<div class="emptyState">جارِ تسجيلك في الكورس…</div>`; return; }
    body.innerHTML = `
      <div class="grid">
        <div class="box"><span class="eyebrow">التقدم</span><p style="font-size:26px;margin:8px 0 0;font-weight:700">${myEnrollment.progress}%</p></div>
        <div class="box"><span class="eyebrow">XP</span><p style="font-size:26px;margin:8px 0 0;font-weight:700">${myEnrollment.xp}</p></div>
        <div class="box"><span class="eyebrow">Streak</span><p style="font-size:26px;margin:8px 0 0;font-weight:700">${myEnrollment.streak}</p></div>
        <div class="box"><span class="eyebrow">مكتمل</span><p style="font-size:26px;margin:8px 0 0;font-weight:700">${myEnrollment.completed_count}</p></div>
      </div>`;
  },

  async renderLeaderboard(body, course){
    const {data} = await db.from("enrollments").select("xp, progress, profiles(full_name)").eq("course_id", course.id).order("xp",{ascending:false}).limit(20);
    if(!data || !data.length){ body.innerHTML = `<div class="emptyState">لا توجد بيانات بعد.</div>`; return; }
    body.innerHTML = `<div class="card2">` + data.map((e,i)=>`
      <div class="row" style="padding:8px 0;${i? 'border-top:1px dashed rgba(255,255,255,.12)':''}">
        <span><span class="mono small">#${i+1}</span> ${CodeUp.escapeHtml(e.profiles?.full_name||"طالب")}</span>
        <span class="small mono">${e.xp} XP · ${e.progress}%</span>
      </div>`).join("") + `</div>`;
  }
};

function statusLabel(s){
  return {on_track:"على المسار",at_risk:"في خطر",behind:"متأخر",inactive:"غير نشط",
    submitted:"تم التسليم",late:"متأخر",missing:"لم يُسلَّم",reviewed:"تمت المراجعة"}[s] || s;
}
</script>
</body>
</html>
