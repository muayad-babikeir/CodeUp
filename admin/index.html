<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeUp — لوحة الإدارة</title>
<link rel="icon" type="image/svg+xml" href="../codeup-logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icons/icon-512.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="gate" style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">جارِ التحقق من الصلاحيات…</div>

<div id="shell" class="adminShell hidden">
  <div class="sidebarScrim" id="sidebarScrim"></div>
  <aside class="sidebar" id="sidebarEl">
    <div class="brand">
      <div class="mark"><img src="../codeup-logo.svg" alt="CodeUp"></div><span>CodeUp Admin</span>
      <button class="iconBtn sidebarToggle" id="sidebarToggleBtn" title="طي/فتح القائمة الجانبية" aria-label="طي/فتح القائمة الجانبية" style="margin-inline-start:auto">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <nav id="navRoot"></nav>
  </aside>
  <main class="main">
    <div class="topRow">
      <div style="display:flex;align-items:center;gap:2px;min-width:0">
        <button class="iconBtn mobileMenuBtn" id="mobileMenuBtn" title="فتح القائمة" aria-label="فتح القائمة" style="margin-inline-end:8px">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div style="min-width:0">
          <div id="pageBreadcrumb" class="breadcrumb"></div>
          <h1 id="pageTitle">لوحة التحكم</h1>
        </div>
      </div>
      <div class="who">
        <button class="iconBtn" id="notifBtn" title="الإشعارات" aria-label="الإشعارات" style="margin-inline-end:8px">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="notifBadge" class="badge hidden">0</span>
        </button>
        <span id="whoLabel"></span> · <a href="#" id="backToApp">تطبيق الطالب</a> · <a href="#" id="signOut">خروج</a>
      </div>
    </div>
    <div id="pageBody"><div class="emptyState">جارِ التحميل…</div></div>
  </main>
</div>

<script src="../js/supabase.js"></script>
<script src="../js/shared.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/courses.js"></script>
<script src="js/content.js"></script>
<script src="js/people.js"></script>
<script src="js/requests.js"></script>
<script src="js/work.js"></script>
<script src="js/community.js"></script>
<script src="js/university.js"></script>
<script src="js/audit.js"></script>
<script src="js/techweek.js"></script>
<script src="js/marketplace.js"></script>
<script>
Admin.boot();
</script>
</body>
</html>
